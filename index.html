<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8FD0F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sky Wallet">
<title>Sky Wallet — กระเป๋าตังของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9F5FE; --card:#FFFFFF; --soft:#F3FAFF; --line:#DCEBF8;
  --ink:#123A63; --ink2:#5B7FA3; --ink3:#94AFC7;
  --sky1:#A6DBFB; --sky2:#63B7F2; --blue:#2C82D8; --deep:#1257A5;
  --in:#0FA37B; --in-s:#DFF5EE; --out:#FF7B89; --out-s:#FFE9EC;
  --gold:#F0A93B; --gold-s:#FFF1DC; --violet:#8A7BD8;
  --shadow:0 4px 20px rgba(38,120,200,.09);
  --cute:'Mali',-apple-system,'Noto Sans Thai',sans-serif;
  --body:'Prompt',-apple-system,'Noto Sans Thai',sans-serif;
}
html[data-theme="dark"]{
  --bg:#0D1926; --card:#152534; --soft:#122030; --line:#233648;
  --ink:#E4F0FA; --ink2:#9BB6CE; --ink3:#6E8AA4;
  --sky1:#2C6B98; --sky2:#2E7FB8; --blue:#63B7F2; --deep:#A6DBFB;
  --in:#4CD3A5; --in-s:#12332A; --out:#FF9AA5; --out-s:#3A2126;
  --gold:#F5C173; --gold-s:#33291A; --violet:#A79BE8;
  --shadow:0 4px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3,.cute{font-family:var(--cute)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--sky2);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== hero ===== */
.hero{position:relative;overflow:hidden;padding:16px 18px 74px;background:linear-gradient(165deg,var(--sky1) 0%,var(--sky2) 65%,var(--blue) 100%)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.28)}
.hero::before{width:150px;height:150px;top:-56px;right:-34px}
.hero::after{width:88px;height:88px;top:52px;right:74px;background:rgba(255,255,255,.18)}
.hrow{display:flex;align-items:center;gap:11px;position:relative;z-index:2}
.brandbtn{display:flex;align-items:center;gap:11px;flex:1;text-align:left;min-width:0}
.brandimg{background-image:var(--logo);background-size:cover;background-position:center;background-repeat:no-repeat}
.mark{width:46px;height:46px;border-radius:15px;flex:none;display:block;box-shadow:0 4px 12px rgba(12,60,110,.22);transition:transform .2s}
.brandbtn:active .mark{transform:rotate(-12deg) scale(.94)}
.spin{animation:sp .6s ease}@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.hname{display:block;font-family:var(--cute);font-weight:700;font-size:21px;color:#fff;line-height:1.15;text-shadow:0 2px 6px rgba(14,70,125,.22)}
.hsub{display:block;font-size:11.5px;color:rgba(255,255,255,.92);line-height:1.35}
.hbtn{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.24);display:grid;place-items:center;color:#fff;font-size:17px;flex:none}
.hbtn:hover{background:rgba(255,255,255,.38)}
.syncbtn{position:relative}
.syncbtn svg{width:21px;height:21px;display:block;transition:transform .3s}
.syncbtn .dot{position:absolute;right:5px;bottom:5px;width:10px;height:10px;border-radius:50%;background:#CBD5E1;border:2px solid rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(10,50,100,.25)}
.syncbtn.s-claude .dot{background:#34D399}
.syncbtn.s-local .dot{background:#FBBF24}
.syncbtn.s-memory .dot{background:#FB7185}
.syncbtn.s-cloud .dot{background:#22C55E}
.syncbtn.busy svg{animation:spin 1s linear infinite}
.syncbtn.saved{animation:pop .5s ease}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}
.wallet{position:relative;z-index:2;margin-top:16px;background:rgba(255,255,255,.95);border-radius:20px;padding:14px 17px;box-shadow:0 6px 18px rgba(11,60,112,.16);display:flex;align-items:center;gap:14px}
html[data-theme="dark"] .wallet{background:var(--card)}
.wallet .lab{font-size:12px;color:var(--ink2)}
.wallet .big{font-family:var(--cute);font-weight:700;font-size:26px;color:var(--deep);line-height:1.2}
.wallet .side{margin-left:auto;text-align:right;font-size:12px;color:var(--ink2)}
.sheet-top{margin-top:-56px;border-radius:28px 28px 0 0;background:var(--bg);padding:16px 16px 112px;position:relative;z-index:3}
main{max-width:760px;margin:0 auto}

/* ===== nav ===== */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:flex-end;gap:2px;background:var(--card);border-radius:22px 22px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(30,100,170,.12)}
nav.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 1px;border-radius:13px;font-size:9.5px;color:var(--ink3);font-weight:500;white-space:nowrap}
nav.tabs button .ne{font-size:17px;line-height:1.15;filter:grayscale(.55);opacity:.75}
nav.tabs button.on{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff;font-weight:600}
nav.tabs button.on .ne{filter:none;opacity:1}
nav.tabs button.fab{flex:none;width:54px;height:54px;border-radius:50%;background:linear-gradient(160deg,var(--sky1),var(--blue));color:#fff;font-size:27px;justify-content:center;box-shadow:0 6px 18px rgba(44,130,216,.45);margin:0 3px}
nav.tabs button.fab .ne{filter:none;opacity:1;font-size:29px;font-weight:300}
nav.tabs button.fab .dk{display:none}
.navbrand{display:none}
@media (min-width:900px){
  .hero{padding-left:250px}
  .sheet-top{padding:16px 26px 40px 250px}
  .hrow{max-width:960px;margin-left:auto;margin-right:auto}
  .wallet{max-width:960px;margin:16px auto 0}
  main{max-width:960px;margin:0 auto}
  nav.tabs{top:0;bottom:0;right:auto;width:216px;flex-direction:column;align-items:stretch;gap:4px;border-radius:0 26px 26px 0;padding:22px 14px;justify-content:flex-start;box-shadow:6px 0 24px rgba(30,100,170,.1)}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:11px 14px;border-radius:16px}
  nav.tabs button.fab{width:auto;height:auto;border-radius:16px;justify-content:flex-start;font-size:14.5px;margin:6px 0}
  nav.tabs button.fab .dk{display:inline}
  nav.tabs button.fab .ne{font-size:20px}
  .navbrand{display:flex!important;align-items:center;gap:10px;padding:4px 8px 18px}
  .navbrand .lg{width:34px;height:34px;border-radius:11px;flex:none}
  .navbrand b{font-family:var(--cute);font-weight:700;font-size:17px;color:var(--deep);line-height:1.1}
  .navbrand span.sb{display:block;font-size:11px;color:var(--ink3);font-weight:400}
}

/* ===== bits ===== */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:16px}
h2.sec{font-size:16.5px;font-weight:600;margin:22px 0 10px;display:flex;align-items:center;gap:7px}
h2.sec:first-child{margin-top:4px}
.muted{color:var(--ink2)}.tiny{font-size:12.5px}.pos{color:var(--in)}.neg{color:var(--out)}
.row{display:flex;align-items:center;gap:11px}
.scroller{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.scroller::-webkit-scrollbar{display:none}
.pill{background:var(--card);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap;box-shadow:var(--shadow)}
.pill.on{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff;font-weight:600}
.segs{display:flex;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--shadow);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.segs button{flex:1 0 auto;padding:9px 13px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.segs button.on{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff;font-weight:600}
.segs.in button.on{background:linear-gradient(160deg,#5FD6B4,var(--in))}
.segs.out button.on{background:linear-gradient(160deg,#FFA3AC,var(--out))}
.btn{background:linear-gradient(160deg,var(--sky2),var(--blue));color:#fff;border-radius:16px;padding:13px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(44,130,216,.28)}
.btn.full{width:100%}
.btn.ghost{background:var(--soft);color:var(--blue);box-shadow:none;border:1.5px solid var(--line)}
.btn.warn{background:linear-gradient(160deg,#FFA3AC,var(--out));box-shadow:none}
.btn:active{transform:translateY(1px)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:15px;background:var(--soft);color:var(--ink)}
label.f{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 6px 3px}
.field+.field{margin-top:12px}
.periodbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.periodbar .nav{width:36px;height:36px;border-radius:13px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--blue);font-weight:600}
.periodbar .lab{flex:1;text-align:center;font-weight:600;font-family:var(--cute)}
.empty{text-align:center;padding:34px 20px;color:var(--ink2)}
.empty .em{font-size:38px}
.empty .big{font-family:var(--cute);font-weight:600;color:var(--ink);margin:6px 0 3px}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.trio div{padding:13px 8px;text-align:center}
.trio div+div{border-left:1.5px solid var(--line)}
.trio .k{font-size:11.5px;color:var(--ink2)}
.trio .v{font-family:var(--cute);font-weight:700;font-size:17px;margin-top:1px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 15px;width:100%;text-align:left;border-bottom:1.5px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--soft)}
.tx.hl{background:linear-gradient(90deg,var(--gold-s),transparent);box-shadow:inset 3px 0 0 var(--gold)}
.tx .ic{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12px;color:var(--ink3)}
.tx .amt{font-weight:600;white-space:nowrap}
.daysep{padding:9px 15px;font-size:12.5px;color:var(--ink2);background:var(--soft);display:flex;justify-content:space-between;font-weight:500}
.bubwrap{padding:6px 4px 2px}
.bub{width:100%;display:block}
.bub circle{cursor:pointer}
.bubhint{text-align:center;font-size:12.5px;color:var(--ink2);min-height:20px;padding:2px 12px 10px}
.bline{padding:12px 15px;border-bottom:1.5px solid var(--line)}
.bline:last-child{border-bottom:0}
.track{height:9px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sky1),var(--blue))}
.fill.warn{background:linear-gradient(90deg,#FFD08A,var(--gold))}
.fill.over{background:linear-gradient(90deg,#FFB0B8,var(--out))}
.fill.save{background:linear-gradient(90deg,#7FE3C4,var(--in))}
.tag{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap;display:inline-block}
.tag.ok{background:var(--in-s);color:var(--in)}
.tag.wait{background:var(--gold-s);color:var(--gold)}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--shadow);margin-bottom:12px}
.searchbar input{border:0;background:transparent;padding:12px 0;flex:1;min-width:0}
.selwrap{display:flex;align-items:center;gap:9px;background:var(--soft);border:1.5px solid var(--line);border-radius:15px;padding:0 13px}
.selwrap .em{font-size:20px;flex:none}
.selwrap select{flex:1;border:0;background:transparent;padding:12px 0;font-weight:500;appearance:none;-webkit-appearance:none;min-width:0}
.selwrap .ar{color:var(--blue);font-size:13px;flex:none}

/* ===== calendar ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:4px 10px 12px}
.cal .dow{text-align:center;font-size:11px;color:var(--ink3);padding:5px 0}
.cal .cell{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--ink2);background:var(--soft)}
.cal .cell.off{background:transparent;color:var(--ink3);opacity:.35}
.cal .cell.today{outline:2px solid var(--sky2)}
.cal .cell.sel{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff;font-weight:600}
.cal .cell .dots{display:flex;gap:2px;height:5px}
.cal .cell i{width:5px;height:5px;border-radius:50%;display:block}

/* ===== wallets ===== */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:13px 14px;text-align:left;border:2px solid transparent}
.wcard.on{border-color:var(--sky2)}
.wcard .e{font-size:22px}
.wcard .n{font-weight:600;font-size:14px;margin-top:3px}
.wcard .b{font-family:var(--cute);font-weight:700;font-size:19px;margin-top:1px}
.wimg{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.wcard .e,.tx .ic,.wsel .e{overflow:hidden}
.swatch button.on{color:#123A63;border-color:var(--sky2)}
.slipbox{border:1.5px dashed var(--line);border-radius:15px;padding:10px;text-align:center;background:var(--soft)}
.slipbox img{max-width:100%;max-height:220px;border-radius:11px;display:block;margin:0 auto}
/* tag chips */
.tagchip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.tagchip .x{opacity:.65;font-size:11px}
.tagpickrow{display:flex;flex-wrap:wrap;gap:6px}
.tagopt{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:13px;background:var(--soft);border:1.5px solid var(--line);font-size:13px}
.tagopt.on{border-color:var(--sky2);background:linear-gradient(165deg,#EAF6FE,#D6ECFB)}
.tagdot{width:10px;height:10px;border-radius:50%;flex:none}
/* wheel time picker */
.wheelrow{position:relative;height:150px;display:flex;align-items:center;justify-content:center;gap:4px;background:var(--soft);border-radius:15px;margin:4px 0}
.wheelcol{height:150px;width:64px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;text-align:center}
.wheelcol::-webkit-scrollbar{display:none}
.wheelspace{height:50px}
.wheelitem{height:50px;line-height:50px;scroll-snap-align:center;font-size:18px;color:var(--ink3);font-variant-numeric:tabular-nums}
.wheelitem.sel{color:var(--deep);font-weight:700;font-size:22px}
.wheelrow.days .wheelcol{width:100%;font-size:16px}
.wheelrow.days .wheelitem{font-size:16px}
.wheelrow.days .wheelitem.sel{font-size:19px}
.wheelsep{font-size:20px;font-weight:700;color:var(--ink2);padding-bottom:2px}
.wheelband{position:absolute;top:50px;left:10px;right:10px;height:50px;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line);pointer-events:none;border-radius:8px}
.wheelmaskT,.wheelmaskB{position:absolute;left:0;right:0;height:50px;pointer-events:none}
.wheelmaskT{top:0;background:linear-gradient(var(--soft),transparent)}
.wheelmaskB{bottom:0;background:linear-gradient(transparent,var(--soft))}
/* small checkbox grids: weekdays / month-days */
.cbgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cbgrid.md{grid-template-columns:repeat(7,1fr)}
.cbday{aspect-ratio:1;border-radius:11px;background:var(--soft);border:1.5px solid var(--line);display:grid;place-items:center;font-size:12.5px;color:var(--ink2);font-weight:500}
.cbday.on{background:linear-gradient(160deg,var(--sky1),var(--sky2));border-color:transparent;color:#fff;font-weight:700}
/* collapsible savings card */
.goalhdr{display:flex;align-items:center;gap:10px;cursor:pointer}
.goalchev{transition:transform .2s;color:var(--ink3);font-size:13px;flex:none}
.goalchev.open{transform:rotate(180deg)}
.goalbody{overflow:hidden;max-height:0;transition:max-height .25s ease}
.goalbody.open{max-height:2000px}
.wcard.add{display:grid;place-items:center;color:var(--blue);border:2px dashed var(--line);box-shadow:none;background:transparent;min-height:96px}

/* ===== menu tiles ===== */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px 8px;margin-bottom:12px}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:16px;font-size:11px;color:var(--ink2);line-height:1.25;text-align:center;font-weight:500}
.tiles button:hover{background:var(--soft)}
.tiles button .e{font-size:24px}
.mlist button{display:flex;align-items:center;gap:13px;width:100%;padding:14px 16px;border-bottom:1.5px solid var(--line);text-align:left}
.mlist button:last-child{border-bottom:0}
table.mtbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.mtbl th,table.mtbl td{padding:9px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.mtbl th{background:var(--soft);color:var(--ink2);font-size:12px;font-weight:500;text-align:left;position:sticky;top:0}
table.mtbl td.r,table.mtbl th.r{text-align:right;font-variant-numeric:tabular-nums}
table.mtbl tr.sum td{background:var(--soft);font-weight:700}
.mlist .e{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.mlist .t{flex:1}
.mlist .t b{display:block;font-weight:600;font-size:14.5px}
.mlist .t span{font-size:12px;color:var(--ink3)}
.subhead{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.subhead .bk{width:38px;height:38px;border-radius:13px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--blue);flex:none}
.subhead b{font-family:var(--cute);font-size:19px;font-weight:700}

/* ===== full-screen add ===== */
.addscreen{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:var(--bg)}
.addtop{flex:none;background:linear-gradient(165deg,var(--sky1),var(--sky2));padding:calc(10px + env(safe-area-inset-top)) 10px 12px;display:flex;align-items:center;gap:6px}
.addtop .tb{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.addtop .tb::-webkit-scrollbar{display:none}
.addtop .tb button{padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.9);white-space:nowrap}
.addtop .tb button.on{background:#fff;color:var(--deep);font-weight:600}
.addtop .x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--deep);display:grid;place-items:center;font-size:17px;flex:none}
.addbody{flex:1;overflow-y:auto;padding:12px 14px 6px;-webkit-overflow-scrolling:touch}
.addfoot{flex:none;background:var(--card);border-radius:22px 22px 0 0;padding:8px 11px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(30,100,170,.14)}
@media (min-width:900px){
  .addbody{max-width:660px;margin:0 auto;width:100%}
  .addfoot{max-width:560px;margin:0 auto;width:100%;border-radius:22px 22px 0 0}
  .addtop .tb{max-width:660px;margin:0 auto}
}
.catbox{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.catbox .hd{display:flex;align-items:center;gap:6px;padding:11px 13px 6px}
.catbox .hd .ttl{flex:1;font-size:13px;color:var(--ink2);font-weight:500}
.catbox .hd button{width:32px;height:32px;border-radius:11px;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-size:14px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:7px;padding:4px 11px 13px}
.cat{background:var(--soft);border-radius:15px;padding:9px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink2);line-height:1.25;text-align:center;border:2px solid transparent}
.cat .e{font-size:21px}
.cat.on{border-color:var(--sky2);background:linear-gradient(165deg,#EAF6FE,#D6ECFB);color:var(--deep);font-weight:600}
.cat .e{width:34px;height:34px;border-radius:12px;display:grid;place-items:center}
.swatch{display:flex;gap:7px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:9px}
.swatch button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:transparent;font-size:15px;font-weight:700;border:2px solid transparent}
.swatch button.on{color:#123A63;border-color:var(--sky2)}
html[data-theme="dark"] .cat.on{background:var(--line)}
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
.chiprow::-webkit-scrollbar{display:none}
.chiprow button{background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:5px 11px;font-size:12px;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.amtbar{display:flex;align-items:center;gap:9px;background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:6px 13px;margin-bottom:6px}
.amtbar .eq{font-size:12px;color:var(--ink3);white-space:nowrap;flex:none}
.amtbar .disp{flex:1;min-width:0;width:100%;text-align:right;font-family:var(--cute);font-weight:700;font-size:24px;line-height:1.25;
  border:0;background:transparent;outline:none;padding:2px 0;-webkit-user-select:text;user-select:text}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.keys button{background:var(--soft);border-radius:12px;padding:8px 0;font-size:17px;font-weight:500;line-height:1.35}
.keys button.op{color:var(--blue)}
.keys button.go{grid-column:span 2;background:linear-gradient(160deg,var(--sky2),var(--blue));color:#fff;font-size:14.5px;font-weight:600}
.keys button.go.inmode{background:linear-gradient(160deg,#5FD6B4,var(--in))}
.keys button.go.tfmode{background:linear-gradient(160deg,#A79BE8,var(--violet))}
.wsel{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:11px 14px;width:100%;text-align:left;margin-bottom:10px}
.wsel .e{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.wsel .t{flex:1;min-width:0}
.wsel .t b{display:block;font-size:14.5px}
.wsel .t span{font-size:12px;color:var(--ink3)}
.arrowmid{text-align:center;color:var(--blue);font-size:18px;margin:-4px 0 6px}
.info{background:var(--soft);border:1.5px solid var(--line);border-radius:15px;padding:11px 13px;font-size:12.5px;color:var(--ink2);display:flex;gap:9px}
.info.warn{background:var(--out-s);border-color:transparent;color:var(--out)}

/* ===== savings / debt slots ===== */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px;margin-top:12px}
.slot{aspect-ratio:1;border-radius:16px;background:var(--soft);border:2px dashed var(--line);display:grid;place-items:center;font-size:11.5px;color:var(--ink3);font-weight:500}
.slot.done{background:linear-gradient(160deg,var(--sky1),var(--sky2));border:2px solid transparent;color:#fff;font-size:17px}
.dslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px;margin-top:11px}
.slots.wide{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.slot .n{display:block;font-size:9px;opacity:.6;font-weight:600;line-height:1.1}
.slot.done .n{opacity:.85}
.slot .v{display:block;font-size:11px;line-height:1.15}
.slot.done .v{font-size:12px;font-weight:700}
.gtag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:600}
.gtag.run{background:var(--gold-s);color:var(--gold)}
.gtag.ok{background:var(--in-s);color:var(--in)}
.prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;margin-top:9px}
.prev span{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 3px;text-align:center;font-size:10.5px;color:var(--ink2);line-height:1.3}
.prev span b{display:block;font-size:11.5px;color:var(--ink);font-weight:700}
.kebab{width:32px;height:32px;border-radius:11px;background:var(--soft);color:var(--ink2);font-size:16px;flex:none}
.tagbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;margin-bottom:4px}
.tagbar::-webkit-scrollbar{display:none}
.tagbar button{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink2);white-space:nowrap;box-shadow:var(--shadow)}
.tagbar button.on{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff;border-color:transparent;font-weight:600}
.tagdot{width:10px;height:10px;border-radius:50%;flex:none}
.budhd{display:flex;align-items:center;gap:10px}
.budhd .e{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.dslot{border-radius:13px;background:var(--soft);border:1.5px dashed var(--line);padding:8px 4px;text-align:center;font-size:11.5px;color:var(--ink3);font-weight:500}
.dslot.done{background:linear-gradient(160deg,var(--sky1),var(--sky2));border:1.5px solid transparent;color:#fff}
.dslot b{display:block;font-size:10px;opacity:.8;font-weight:400}
.fx{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1.5px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx .ic{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}

/* ===== modal ===== */
.ov{position:fixed;inset:0;background:rgba(12,45,80,.42);z-index:80;display:none}
.ov.open{display:block}
.md{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;display:none}
.md.open{display:block;animation:up .2s ease}
@keyframes up{from{transform:translateY(16px)}to{transform:none}}
@media (min-width:700px){.md{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:470px;border-radius:24px}.md.open{animation:none}}
.md h3{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:9px 13px;font-size:13px;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.opt.on{border-color:var(--sky2);color:var(--deep);font-weight:500}
.opt .ck{width:20px;height:20px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;color:transparent}
.opt.on .ck{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff}
.emopick{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-height:150px;overflow-y:auto;background:var(--soft);border-radius:14px;padding:8px}
.emopick button{aspect-ratio:1;border-radius:10px;font-size:19px}
.emopick button.on{background:linear-gradient(160deg,var(--sky1),var(--sky2))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:95;background:var(--deep);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 6px 20px rgba(10,50,100,.3);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:99;color:var(--ink2);font-family:var(--cute)}
#loading .lg{width:84px;height:84px;border-radius:26px;box-shadow:0 8px 24px rgba(40,120,200,.22);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style>
</head>

function wheelHTML(time,id){
  const[hh,mm]=(time||'09:00').split(':');
  const H=Array.from({length:24},(_,i)=>pad(i)),M=Array.from({length:60},(_,i)=>pad(i));
  const col=(arr,sel,tag)=>`<div class="wheelcol" data-wheel="${tag}"><div class="wheelspace"></div>${arr.map(v=>
    `<div class="wheelitem ${v===sel?'sel':''}" data-wv="${v}">${v}</div>`).join('')}<div class="wheelspace"></div></div>`;
  return `<div class="wheelrow" id="${id}"><div class="wheelband"></div>${col(H,hh,'h')}<div class="wheelsep">:</div>${col(M,mm,'m')}
    <div class="wheelmaskT"></div><div class="wheelmaskB"></div></div>`;
}
function bindWheel(id,onChange){
  const box=$('#'+id);if(!box)return;
  box.querySelectorAll('.wheelcol').forEach(col=>{
    const items=[...col.querySelectorAll('.wheelitem')];
    const idx0=Math.max(0,items.findIndex(it=>it.classList.contains('sel')));
    col.scrollTop=idx0*50;
    let t=null;
    col.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{
      const idx=Math.max(0,Math.min(items.length-1,Math.round(col.scrollTop/50)));
      col.scrollTop=idx*50;
      items.forEach((it,i)=>it.classList.toggle('sel',i===idx));
      onChange(col.dataset.wheel,items[idx].dataset.wv);
    },110);});
  });
}

function calcExpr(x){
  const tk=String(x).match(/(\d+\.?\d*|[+\-*/])/g);if(!tk)return 0;
  const a=[];for(let i=0;i<tk.length;i++){const t=tk[i];
    if(t==='*'||t==='/'){const b=parseFloat(tk[++i]||'0');const p=a.pop()||0;a.push(t==='*'?p*b:(b?p/b:0));}
    else a.push(t==='+'||t==='-'?t:parseFloat(t));}
  let r=typeof a[0]==='number'?a[0]:0;
  for(let i=1;i<a.length;i+=2){const op=a[i],v=Number(a[i+1])||0;r=op==='-'?r-v:r+v;}
  return Math.round(r*100)/100;
}

/* =========== BUBBLES =========== */
function bubbles(items,total,type){
  if(!items.length)return`<div class="empty"><div class="em">${type==='in'?'💰':'🫧'}</div><div class="big">ยังไม่มี${type==='in'?'รายรับ':'รายจ่าย'}ในช่วงนี้</div><div class="tiny">กดปุ่ม ＋ เพื่อบันทึกรายการแรก</div></div>`;
  const list=items.slice(0,11),maxV=list[0].v,rad=v=>20+40*Math.sqrt(v/maxV);
  const P0={x:0,y:0,r:rad(list[0].v),d:list[0]},placed=[P0],rest=list.slice(1);
  let prevR=P0.r;
  [rest.slice(0,7),rest.slice(7)].forEach(ring=>{
    if(!ring.length)return;
    const rs=ring.map(d=>rad(d.v)),ringR=prevR+Math.max(...rs)+9,tot=rs.reduce((a,b)=>a+b,0);
    let ang=-Math.PI/2;
    ring.forEach((d,i)=>{const sh=2*Math.PI*(rs[i]/tot),a=ang+sh/2;
      placed.push({x:Math.cos(a)*ringR,y:Math.sin(a)*ringR,r:rs[i],d});ang+=sh;});
    prevR=ringR+Math.max(...rs);
  });
  const minX=Math.min(...placed.map(p=>p.x-p.r))-4,maxX=Math.max(...placed.map(p=>p.x+p.r))+4;
  const minY=Math.min(...placed.map(p=>p.y-p.r))-4,maxY=Math.max(...placed.map(p=>p.y+p.r))+4;
  let sv=`<svg class="bub" viewBox="${minX} ${minY} ${maxX-minX} ${maxY-minY}" style="max-height:340px">`;
  placed.forEach((p,i)=>{const c=palColor(items.indexOf(p.d));
    sv+=`<g><circle cx="${p.x}" cy="${p.y}" r="${p.r}" style="fill:${c}" data-bub="${p.d.k}"/>`;
    const fs=Math.max(6,Math.min(11,p.r*.26));
    if(p.r>26)sv+=`<text x="${p.x}" y="${p.y-p.r*.14}" text-anchor="middle" style="font-size:${fs*1.5}px;pointer-events:none">${p.d.c.e}</text>`;
    if(p.r>32)sv+=`<text x="${p.x}" y="${p.y+p.r*.3}" text-anchor="middle" style="font-size:${fs}px;fill:#123A63;font-weight:600;pointer-events:none">${esc(p.d.c.n)}</text>`;
    sv+=`<text x="${p.x}" y="${p.r>32?p.y+p.r*.3+fs*1.15:(p.r>26?p.y+p.r*.42:p.y+fs*.35)}" text-anchor="middle" style="font-size:${fs*1.05}px;fill:#123A63;font-weight:700;pointer-events:none">${money(p.d.v)}</text></g>`;});
  return`<div class="bubwrap">${sv}</svg></div><div class="bubhint" id="bubhint">แตะวงกลมเพื่อดูรายละเอียด · แสดง ${list.length} จาก ${items.length} หมวด</div>`;
}

function secCalendar(){

  const list=txIn(first,last,homeWallet);
  const day={};list.forEach(t=>{const k=t.date;day[k]=day[k]||{i:0,o:0};
    if(t.type==='in')day[k].i+=t.amount; else if(t.type==='out')day[k].o+=t.amount;});
  const i=sum(list,'in'),o=sum(list,'out');

let trendSide='out',trendMonth=null,trendWallets=[],trendCats=[];
function trendFilter(t){
  if(trendWallets.length){ if(t.type==='tf'){if(!trendWallets.includes(t.w)&&!trendWallets.includes(t.w2))return false;}
    else if(!trendWallets.includes(t.w))return false; }
  else if(homeWallet!=='all'){ if(t.type==='tf'){if(t.w!==homeWallet&&t.w2!==homeWallet)return false;} else if(t.w!==homeWallet)return false; }
  if(trendCats.length&&!trendCats.includes(t.cat))return false;
  return true;
}
function secTrend(){
  const c=trendMonth?parse(trendMonth+'-01'):new Date(P.cursor.getFullYear(),P.cursor.getMonth(),1);
  const y=c.getFullYear(),m=c.getMonth(),last=new Date(y,m+1,0).getDate();
  const now=new Date(),cur=(now.getFullYear()===y&&now.getMonth()===m);
  const today=cur?now.getDate():last;
  const side=trendSide;
  const daily=new Array(last).fill(0);
  S.tx.filter(t=>t.type===side&&trendFilter(t)).forEach(t=>{const d=parse(t.date);
    if(d.getFullYear()===y&&d.getMonth()===m)daily[d.getDate()-1]+=t.amount;});
  let acc=0;const cum=daily.map(v=>acc+=v);
  const spent=cum[today-1]||0;
  let p3=0,cnt=0;
  for(let k=1;k<=3;k++){const a=new Date(y,m-k,1),b=new Date(y,m-k+1,0);
    const v=S.tx.filter(t=>t.type===side&&trendFilter(t)&&parse(t.date)>=a&&parse(t.date)<=b).reduce((x,t)=>x+t.amount,0);
    if(v>0){p3+=v;cnt++;}}
  const avg3=cnt?p3/cnt:0;
  const proj=today?Math.round(spent/today*last):0;
  const keep=Math.max(0,proj-spent);
  const mx=Math.max(1,...cum,avg3);
  const W=320,H=96;
  const pts=cum.slice(0,today).map((v,i)=>`${(i/Math.max(1,last-1))*W},${H-(v/mx)*H}`).join(' ');
  const avgY=H-(avg3/mx)*H;
  const col=side==='in'?'var(--in)':'var(--out)';
  const wn=trendWallets.length?`${trendWallets.length} กระเป๋า`:(homeWallet==='all'?'ทุกกระเป๋า':(walOf(homeWallet)||{}).name||'');
  const cn=trendCats.length?`${trendCats.length} หมวด`:'ทุกหมวดหมู่';
  let h=`<h2 class="sec">📈 แนวโน้ม</h2>`;
  h+=`<div class="segs ${side}" style="margin-bottom:8px">
      <button data-tside2="out" class="${side==='out'?'on':''}">รายจ่าย</button>
      <button data-tside2="in" class="${side==='in'?'on':''}">รายรับ</button></div>
    <div class="scroller" style="gap:7px;margin-bottom:10px">
      <button class="pill" data-tmon="1">📆 เดือน${TH_MF[m]} (1 ${TH_M[m]} – ${last} ${TH_M[m]} ${y+543}) ▾</button>
      <button class="pill ${trendWallets.length?'on':''}" data-twal="1">👛 ${esc(wn)} ▾</button>
      <button class="pill ${trendCats.length?'on':''}" data-tcat="1">🗂️ ${esc(cn)} ▾</button>
      ${(trendWallets.length||trendCats.length)?'<button class="pill" data-tclear="1">ล้างตัวกรอง</button>':''}</div>`;
  h+=`<div class="card" style="margin-bottom:12px"><div style="padding:14px 14px 4px">
    <svg viewBox="0 0 ${W} ${H+4}" preserveAspectRatio="none" style="width:100%;height:110px;display:block">
      <line x1="0" y1="${avgY}" x2="${W}" y2="${avgY}" style="stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4"/>
      ${pts?`<polyline points="${pts}" style="fill:none;stroke:${col};stroke-width:2.5;stroke-linejoin:round"/>`:''}
      <line x1="0" y1="${H}" x2="${W}" y2="${H}" style="stroke:var(--line);stroke-width:1.5"/></svg>
    <div class="row tiny muted" style="margin-top:4px"><span>1 ${TH_M[m]}</span>
      <span style="margin-left:auto">${last} ${TH_M[m]}</span></div>
    <div class="tiny muted" style="margin-top:4px">- - - เส้นประ = เฉลี่ย 3 เดือนก่อนหน้า ${money(avg3)}</div></div>
    <div class="trio" style="box-shadow:none;border-radius:0;border-top:1.5px solid var(--line)">
      <div><div class="k">${side==='in'?'รายรับรวม':'รายจ่ายรวม'}</div><div class="v num" style="color:${col}">${money(spent)}</div></div>
      <div><div class="k">ยอดคาดการณ์</div><div class="v num" style="color:var(--gold)">${money(proj)}</div></div>
      <div><div class="k">${side==='in'?'คาดว่าได้อีก':'ควรกันเงินไว้'}</div><div class="v num" style="color:var(--deep)">${money(keep)}</div></div>
    </div>
    <div class="bline tiny muted">เฉลี่ย 3 เดือนก่อนหน้า <b>${money(avg3)}</b> · เดือนนี้ ${avg3?(spent>avg3?`สูงกว่า ${money(spent-avg3)}`:`ต่ำกว่า ${money(avg3-spent)}`):'ยังไม่มีข้อมูลเทียบ'}</div></div>`;
  return h;
}

const TAX_BR=[[150000,0],[300000,.05],[500000,.10],[750000,.15],[1000000,.20],[2000000,.25],[5000000,.30],[Infinity,.35]];
function calcTax(net){
  let last=0,tax=0;const rows=[];
  for(const[cap,rate]of TAX_BR){
    if(net<=last)break;
    const part=Math.min(net,cap)-last,t=part*rate;
    tax+=t;rows.push({from:last,to:cap,rate,part,t});
    last=cap;
  }
  return{tax:Math.round(tax*100)/100,rows};
}
function taxCfg(){
  S.tax=Object.assign({year:0,manualIncome:'',expMode:'auto',expManual:'',spouse:0,kids:0,parents:0,
    sso:'',life:'',rmf:'',home:'',donate:'',wht:''},S.tax||{});
  return S.tax;
}
function taxIncome(y){
  const a=new Date(y,0,1),b=new Date(y,11,31);
  return S.tx.filter(t=>t.type==='in'&&parse(t.date)>=a&&parse(t.date)<=b).reduce((x,t)=>x+t.amount,0);
}
function taxCompute(){
  const T=taxCfg(),y=T.year||new Date().getFullYear();
  const auto=taxIncome(y);
  const gross=T.manualIncome!==''&&T.manualIncome!=null?Number(T.manualIncome)||0:auto;
  const exp=T.expMode==='manual'?(Number(T.expManual)||0):Math.min(gross*0.5,100000);
  const afterExp=Math.max(0,gross-exp);
  const D={personal:60000,spouse:(Number(T.spouse)||0)*60000,kids:(Number(T.kids)||0)*30000,
    parents:Math.min(Number(T.parents)||0,4)*30000,sso:Math.min(Number(T.sso)||0,9000),
    life:Math.min(Number(T.life)||0,100000),rmf:Number(T.rmf)||0,home:Math.min(Number(T.home)||0,100000)};
  const deduct=Object.values(D).reduce((a,b)=>a+b,0);
  const net0=Math.max(0,afterExp-deduct);
  const donate=Math.min(Number(T.donate)||0,net0*0.1);
  const net=Math.max(0,net0-donate);
  const{tax,rows}=calcTax(net);
  const wht=Number(T.wht)||0;
  return{y,auto,gross,exp,afterExp,D,deduct,net0,donate,net,tax,rows,wht,due:Math.round((tax-wht)*100)/100,
    eff:gross?tax/gross*100:0};
}

/* ===== ออมเงิน — เครื่องคำนวณตารางออม ===== */
const SVP=[['year','รายปี'],['month','รายเดือน'],['week','รายสัปดาห์'],['custom','กำหนดเอง']];
const SVDISP={year:[['day','รายวัน'],['week','รายสัปดาห์'],['month','รายเดือน']],
              month:[['day','รายวัน'],['week','รายสัปดาห์']],
              week:[['day','รายวัน · 7 ช่อง']],custom:[]};
const SVPN=k=>(SVP.find(x=>x[0]===k)||['','—'])[1];
const SVDN=(pd,k)=>((SVDISP[pd]||[]).find(x=>x[0]===k)||['','—'])[1];
const r2=x=>Math.round(x*100)/100;
function slotCount(g){
  if(g.kind!=='table')return 1;
  if(g.period==='custom')return Math.max(1,Math.min(365,Math.round(Number(g.slots)||1)));
  const st=g.start?parse(g.start):new Date();
  if(g.period==='year'){const y=st.getFullYear();
    if(g.disp==='month')return 12;
    if(g.disp==='week')return 52;
    return((y%4===0&&y%100!==0)||y%400===0)?366:365;}
  if(g.period==='month'){
    if(g.disp==='week')return 4;
    return new Date(st.getFullYear(),st.getMonth()+1,0).getDate();}
  return 7;
}
function slotAmounts(g){
  const n=slotCount(g),T=Number(g.target)||0,a=[];
  if(g.mode==='ladder'){const base=T/(n*(n+1)/2);for(let i=1;i<=n;i++)a.push(r2(i*base));}
  else{const e=T/n;for(let i=0;i<n;i++)a.push(r2(e));}
  const head=a.slice(0,n-1).reduce((x,y)=>x+y,0);
  a[n-1]=r2(T-head);
  return a;
}
function goalSaved(g){
  if(g.kind!=='table')return Math.min(Number(g.target)||0,Number(g.saved)||0);
  const a=slotAmounts(g),f=g.filled||{};
  return r2(a.reduce((x,v,i)=>x+(f[i]?v:0),0));
}
function goalDoneSlots(g){const f=g.filled||{};return Object.keys(f).filter(k=>f[k]).length;}
function goalRuleText(g){
  if(g.kind!=='table')return'ออมปกติ · หยอดอิสระ';
  return`${SVPN(g.period)}${g.period==='custom'?` · ${slotCount(g)} ช่อง`:` · แสดงเป็น${SVDN(g.period,g.disp)}`} · ${g.mode==='ladder'?'เพิ่มขึ้นเรื่อยๆ':'เท่ากันทุกช่อง'}`;
}
function ringSVG(p,size){
  const R=30,C=2*Math.PI*R,len=C*Math.max(0,Math.min(1,p/100)),sz=size||74;
  return`<svg width="${sz}" height="${sz}" viewBox="0 0 72 72" style="flex:none">
    <circle cx="36" cy="36" r="30" style="fill:none;stroke:var(--soft);stroke-width:8"/>
    <circle cx="36" cy="36" r="30" style="fill:none;stroke:${p>=100?'var(--in)':'var(--blue)'};stroke-width:8;stroke-linecap:round"
      stroke-dasharray="${len} ${C-len}" transform="rotate(-90 36 36)"/>
    <text x="36" y="41" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--ink);font-family:var(--cute)">${Math.round(p)}%</text></svg>`;
}
function slotDateLab(g,i){
  if(g.kind!=='table'||!g.start)return'#'+(i+1);
  const st=parse(g.start),d=new Date(st);
  if(g.period==='week'||g.disp==='day'){d.setDate(st.getDate()+i);return`${d.getDate()}/${d.getMonth()+1}`;}
  if(g.disp==='week'){d.setDate(st.getDate()+i*7);return`ส.${i+1}`;}
  if(g.disp==='month'){d.setMonth(st.getMonth()+i);return TH_M[d.getMonth()].replace('.','');}
  return'#'+(i+1);
}

function debtStats(){const a=S.debts||[];
  return{left:a.reduce((x,d)=>x+Math.max(0,(d.n-(d.paid||0))*d.per),0),
    perM:a.filter(d=>(d.paid||0)<d.n).reduce((x,d)=>x+d.per,0),
    paid:a.reduce((x,d)=>x+(d.paid||0)*d.per,0)};}

function cardCycle(w){
  const now=new Date(),stmt=Number(w.stmt||0),due=Number(w.due||0),mode=w.cycMode||'first';
  if(!stmt)return null;
  let st,e;
  if(mode==='first'){
    st=new Date(now.getFullYear(),now.getMonth(),stmt);
    if(now.getDate()<stmt)st=new Date(now.getFullYear(),now.getMonth()-1,stmt);
    e=new Date(st.getFullYear(),st.getMonth()+1,stmt-1);
  }else{
    e=new Date(now.getFullYear(),now.getMonth(),stmt);
    if(now.getDate()>stmt)e=new Date(now.getFullYear(),now.getMonth()+1,stmt);
    st=new Date(e.getFullYear(),e.getMonth()-1,stmt+1);
  }
  const list=S.tx.filter(t=>{const d=parse(t.date);return d>=st&&d<=e&&(t.w===w.id||t.w2===w.id);});
  let amt=0;list.forEach(t=>{if(t.type==='out'&&t.w===w.id)amt+=t.amount;
    else if(t.type==='tf'&&t.w2===w.id)amt-=t.amount; else if(t.type==='tf'&&t.w===w.id)amt+=t.amount;
    else if(t.type==='adj'&&t.w===w.id)amt-=t.amount;});
  let dd=null;
  if(due){dd=new Date(e.getFullYear(),e.getMonth(),due);if(dd<e)dd=new Date(e.getFullYear(),e.getMonth()+1,due);}
  return{start:st,end:e,amt,due:dd,left:Math.max(0,Math.ceil((e-now)/864e5))};
}

const LCYC={day:{n:'ทุกวัน',d:1},week:{n:'ทุกสัปดาห์',d:7},month:{n:'ทุกเดือน',d:30},year:{n:'ทุกปี',d:365}};
function lendTotal(x){const r=Number(x.rate)||0;return Math.round(Number(x.amount||0)*(1+r/100)*100)/100;}
function lendPer(x){const n=Math.max(1,Number(x.inst)||1);return Math.round(lendTotal(x)/n*100)/100;}
function lendPaid(x){return Math.min(Number(x.paid)||0,Math.max(1,Number(x.inst)||1))*lendPer(x);}
function lendLeft(x){return x.done?0:Math.max(0,Math.round((lendTotal(x)-lendPaid(x))*100)/100);}
function lendDueList(x){
  const n=Math.max(1,Number(x.inst)||1),c=LCYC[x.cyc]||LCYC.month,st=parse(x.date);
  return Array.from({length:n},(_,i)=>{const d=new Date(st);
    if(x.cyc==='month')d.setMonth(d.getMonth()+i+1);
    else if(x.cyc==='year')d.setFullYear(d.getFullYear()+i+1);
    else d.setDate(d.getDate()+c.d*(i+1));
    return d;});
}

function lendPayOne(id){
  const x=(S.lends||[]).find(v=>v.id===id);if(!x)return;
  const n=Math.max(1,Number(x.inst)||1);
  if((x.paid||0)>=n){x.done=true;save();render();return;}
  x.paid=(x.paid||0)+1;
  const per=lendPer(x);
  if(!x.noWallet&&x.w){
    const sign=x.kind==='borrow'?-1:1;
    S.tx.push({id:uid(),type:'adj',amount:sign*per,note:(x.kind==='borrow'?'จ่ายคืน ':'รับคืนจาก ')+(x.person||'')+` งวด ${x.paid}/${n}`,
      date:key(new Date()),ts:Date.now(),tm:nowHM(),w:x.w,lend:x.id});
  }
  if(x.paid>=n)x.done=true;
  logAdd('edit',`${x.kind==='borrow'?'จ่ายคืน':'รับคืน'} ${money(per)} บาท`,`${x.name} งวด ${x.paid}/${n}`);
  save();render();toast(x.done?'เคลียร์ครบแล้ว 🎉':`บันทึกงวด ${x.paid}/${n} แล้ว ✓`);
}

function renderAdd(){
  $('#addhost').innerHTML=addOpen?addHTML():'';
  const q=$('#acq'); if(q){q.oninput=()=>{addCatQ=q.value;const g=$('#acgrid');if(g)g.innerHTML=addCatGrid();};q.focus();}
  const ai=$('#amtDisp');
  if(ai){
    const clean=()=>{
      let v=String(ai.value||'').replace(/[,\s฿]/g,'').replace(/[^0-9.+\-*/]/g,'');
      if(v!==ai.value)ai.value=v;
      AD.expr=v;const eq=$('#amtEq');if(eq)eq.textContent=liveEq();
    };
    ai.oninput=clean;
    ai.onpaste=()=>setTimeout(clean,0);
    ai.onfocus=()=>{try{ai.setSelectionRange(ai.value.length,ai.value.length);}catch(e){}};
  }
}
function openAdd(tab){
  if(!hasWal()){toast('เพิ่มกระเป๋าก่อนนะคะ 👛');go('wallet');walSheet(null);return;}
  addOpen=true;AD.tab=tab||AD.tab;AD.expr='';AD.note='';AD.img='';AD.tags=[];AD.date=key(new Date());addCatQ='';
  if(!AD.w||!walOf(AD.w)){const fp=firstPay();AD.w=fp?fp.id:null;}
  if(AD.tab==='cc'){const c=creditWallets();AD.w2=c.length?c[0].id:null;
    const p=payWallets();AD.w=p.length?p[0].id:(S.wallets[0]?S.wallets[0].id:null);}
  if(AD.tab==='tf'&&S.wallets.length>1){const o=S.wallets.find(x=>x.id!==AD.w);AD.w2=o?o.id:null;}
  if(AD.tab==='inst'){const d=(S.debts||[]).find(x=>(x.paid||0)<x.n);AD.debt=d?d.id:null;if(d)AD.expr=String(d.per);}
  renderAdd();
}
function closeAdd(){addOpen=false;renderAdd();render();}
function liveEq(){
  if(!/[+\-*/]/.test(AD.expr))return'';
  const v=calcExpr(AD.expr);return v?'= '+money(v,2)+' ':'';
}
function applyPct(){
  const m=AD.expr.match(/^(.*?)([+\-*/])(\d+\.?\d*)$/);
  if(m){const A=calcExpr(m[1]),op=m[2],B=parseFloat(m[3]);
    const v=(op==='+'||op==='-')?A*B/100:B/100;
    AD.expr=m[1]+op+String(Math.round(v*100)/100);
  }else{const n=parseFloat(AD.expr)||0;AD.expr=String(Math.round(n)/100);}
}
function pressKey(k){
  if(k==='save')return saveAdd();
  if(k==='C')AD.expr='';
  else if(k==='back')AD.expr=AD.expr.slice(0,-1);
  else if(k==='%'){if(!AD.expr)return;applyPct();}
  else if(k==='=')AD.expr=String(calcExpr(AD.expr));
  else if('+-*/'.includes(k)){if(!AD.expr)return;if('+-*/'.includes(AD.expr.slice(-1)))AD.expr=AD.expr.slice(0,-1);AD.expr+=k;}
  else AD.expr+=k;
  const disp=$('#amtDisp');if(disp)disp.value=AD.expr;
  const eq=$('#amtEq');if(eq)eq.textContent=liveEq();
}
function saveAdd(){
  const v=calcExpr(AD.expr);
  if(!v||v<=0){toast('ใส่จำนวนเงินก่อนนะคะ');return;}
  const t=AD.tab;
  if(t==='out'||t==='in'){
    if(!AD.w){toast('เลือกกระเป๋าก่อนนะคะ 👛');return;}
    S.tx.push({id:uid(),type:t,amount:v,cat:AD.cat,note:AD.note.trim(),date:AD.date,ts:Date.now(),tm:nowHM(),w:AD.w,img:AD.img||'',tags:(AD.tags||[]).slice()});
    logAdd('add',`${t==='in'?'รายรับ':'รายจ่าย'} ${money(v)} บาท`,`${catOf(AD.cat,t).n}${AD.note?' · '+AD.note:''} · ${walOf(AD.w)?walOf(AD.w).name:''} · ${dLab(parse(AD.date))}`);
    toast(`บันทึกแล้ว ${t==='in'?'+':'-'}฿${money(v)} 🎉`);
  }else if(t==='cc'){
    if(!AD.w2){toast('เลือกบัตรเครดิตก่อนค่ะ');return;}
    if(AD.ccMode==='back'){
      S.tx.push({id:uid(),type:'adj',amount:v,note:AD.note.trim()||'รับ Cashback',date:AD.date,ts:Date.now(),tm:nowHM(),w:AD.w2,cc:true,img:AD.img||''});
      logAdd('add',`รับ Cashback ${money(v)} บาท`,`${walOf(AD.w2)?walOf(AD.w2).name:''}`);
      toast(`รับ Cashback ฿${money(v)} 🎁`);
    }else if(AD.ccMode==='cash'){
      S.tx.push({id:uid(),type:'tf',amount:v,note:AD.note.trim()||'กดเงินสดจากบัตร',date:AD.date,ts:Date.now(),tm:nowHM(),w:AD.w2,w2:AD.w,cc:true,img:AD.img||''});
      logAdd('move',`กดเงินสด ${money(v)} บาท`,`${walOf(AD.w2)?walOf(AD.w2).name:''} → ${walOf(AD.w)?walOf(AD.w).name:''}`);
      toast(`กดเงินสด ฿${money(v)} ✓`);
    }else{
      S.tx.push({id:uid(),type:'tf',amount:v,note:AD.note.trim()||'จ่ายบัตรเครดิต',date:AD.date,ts:Date.now(),tm:nowHM(),w:AD.w,w2:AD.w2,cc:true,img:AD.img||''});
      logAdd('move',`จ่ายบัตรเครดิต ${money(v)} บาท`,`${walOf(AD.w)?walOf(AD.w).name:''} → ${walOf(AD.w2)?walOf(AD.w2).name:''}`);
      toast(`จ่ายบัตรเครดิต ฿${money(v)} ✓`);
    }
  }else if(t==='tf'){
    if(!AD.w2||AD.w2===AD.w){toast('เลือกกระเป๋าปลายทางที่ต่างจากต้นทางค่ะ');return;}
    S.tx.push({id:uid(),type:'tf',amount:v,note:AD.note.trim()||'โอนเงิน',date:AD.date,ts:Date.now(),tm:nowHM(),w:AD.w,w2:AD.w2,img:AD.img||'',tags:(AD.tags||[]).slice()});
    logAdd('move',`โยกเงิน ${money(v)} บาท`,`${walOf(AD.w)?walOf(AD.w).name:''} → ${walOf(AD.w2)?walOf(AD.w2).name:''}`);
    toast(`โอนเงิน ฿${money(v)} ✓`);
  }else{
    const d=(S.debts||[]).find(x=>x.id===AD.debt);
    if(!d){toast('เลือกรายการผ่อนก่อนค่ะ');return;}
    if((d.paid||0)>=d.n){toast('รายการนี้ผ่อนหมดแล้ว 🎉');return;}
    d.paid=(d.paid||0)+1;
    const cid=S.cats.out.find(c=>c.id==='debt')?'debt':S.cats.out[0].id;
    S.tx.push({id:uid(),type:'out',amount:v,cat:cid,note:AD.note.trim()||`${d.name} งวดที่ ${d.paid}`,date:AD.date,ts:Date.now(),tm:nowHM(),w:AD.w,debt:d.id,img:AD.img||''});
    logAdd('add',`จ่ายค่างวด ${money(v)} บาท`,`${d.name} งวดที่ ${d.paid}/${d.n}`);
    toast(`จ่ายงวดที่ ${d.paid}/${d.n} แล้ว 💸`);
  }
  save();AD.expr='';AD.note='';AD.img='';AD.tags=[];renderAdd();
}

function noteSuggest(){
  const seen={},out=[];
  S.tx.slice().sort((a,b)=>b.ts-a.ts).forEach(t=>{const n=(t.note||'').trim();
    if(n&&!seen[n]&&out.length<8){seen[n]=1;out.push(n);}});
  const def=AD.tab==='in'?['เงินเดือน','โบนัส','งานเสริม']:['ค่าอาหาร','ค่าเดินทาง','ค่ากาแฟ','ของใช้'];
  def.forEach(d=>{if(out.length<8&&!seen[d])out.push(d);});
  return out;
}

/* ===== งบประมาณ (รูปแบบใหม่: รายวัน/สัปดาห์/เดือน/กำหนดเอง) ===== */
const BDP=[['day','รายวัน'],['week','รายสัปดาห์'],['month','รายเดือน'],['custom','กำหนดเอง']];
const BDPN=k=>(BDP.find(x=>x[0]===k)||['','—'])[1];
const dayDiff=(a,b)=>Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
function budRange(b){
  const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(b.period==='day')return{s:d0,e:d0};
  if(b.period==='week'){const ws=Number(b.weekStart)||0,off=(d0.getDay()-ws+7)%7;
    const st=new Date(d0);st.setDate(d0.getDate()-off);const en=new Date(st);en.setDate(st.getDate()+6);return{s:st,e:en};}
  if(b.period==='month')return{s:new Date(now.getFullYear(),now.getMonth(),1),e:new Date(now.getFullYear(),now.getMonth()+1,0)};
  let st=b.from?parse(b.from):d0,en=b.to?parse(b.to):d0;
  if(en<st)en=new Date(st);
  const len=dayDiff(st,en)+1;
  if(b.repeat){let guard=0;while(en<d0&&guard++<4000){st=new Date(st);st.setDate(st.getDate()+len);en=new Date(en);en.setDate(en.getDate()+len);}}
  return{s:st,e:en};
}
function budMatch(b,t){
  if(t.type!=='out')return false;
  if(b.wallets&&b.wallets.length&&!b.wallets.includes(t.w))return false;
  if(b.cats&&b.cats.length&&!b.cats.includes(t.cat))return false;
  if(b.tags&&b.tags.length&&!(t.tags||[]).some(x=>b.tags.includes(x)))return false;
  return true;
}
function budSpent(b){
  const{s,e}=budRange(b);
  return S.tx.filter(t=>{const d=parse(t.date);return d>=s&&d<=e&&budMatch(b,t);}).reduce((a,t)=>a+t.amount,0);
}
function budDaysLeft(b){const{e}=budRange(b);return Math.max(0,dayDiff(new Date(),e))+1;}
function budRangeLabel(b){
  const{s,e}=budRange(b);
  if(b.period==='day')return`วันนี้ · ${dLab(s)}`;
  if(b.period==='month')return`${TH_MF[s.getMonth()]} ${s.getFullYear()+543}`;
  return`${dLab(s)} – ${dLab(e)}`;
}
function budScopeText(b){
  const w=(b.wallets||[]).length?`${b.wallets.length} กระเป๋า`:'ทุกกระเป๋า';
  const c=(b.cats||[]).length?((b.cats||[]).length===1?catOf(b.cats[0],'out').n:`${b.cats.length} หมวด`):'ทุกหมวด';
  const g=(b.tags||[]).length?` · ${b.tags.length} แท็ก`:'';
  return`${w} · ${c}${g}`;
}
function budTotals(){
  const a=S.buds||[];
  return{tot:a.reduce((x,b)=>x+(Number(b.amount)||0),0),used:a.reduce((x,b)=>x+budSpent(b),0),n:a.length};
}

    }
    const wn=(F.wallets||[]).length?F.wallets.map(i=>walOf(i)?walOf(i).name:'').filter(Boolean).join(', '):'ทุกกระเป๋า';

function bindWheelDays(id,cb){
  const box=$('#'+id);if(!box)return;
  const col=box.querySelector('.wheelcol');if(!col)return;
  const items=[...col.querySelectorAll('.wheelitem')];
  const i0=Math.max(0,items.findIndex(it=>it.classList.contains('sel')));
  col.scrollTop=i0*50;let t=null;
  col.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{
    const idx=Math.max(0,Math.min(items.length-1,Math.round(col.scrollTop/50)));
    col.scrollTop=idx*50;items.forEach((it,i)=>it.classList.toggle('sel',i===idx));
    cb(Number(items[idx].dataset.wv));},110);});
}

let goalOpen={};

function occDatesInRange(f,rs,re){
  const out=[];
  const sB=f.start?parse(f.start):null, eB=f.end?parse(f.end):null;
  const d=new Date(rs.getFullYear(),rs.getMonth(),rs.getDate());
  const stop=new Date(re.getFullYear(),re.getMonth(),re.getDate());
  while(d<=stop){
    let ok=true;
    if(sB&&d<sB)ok=false;
    if(eB&&d>eB)ok=false;
    if(ok){
      if(f.freq==='daily')out.push(new Date(d));
      else if(f.freq==='weekly'){if((f.days||[]).includes(d.getDay()))out.push(new Date(d));}
      else if(f.freq==='monthly'){if((f.monthDays||[]).includes(d.getDate()))out.push(new Date(d));}
    }
    d.setDate(d.getDate()+1);
  }
  return out;
}
function freqSummary(f){
  if(f.freq==='daily')return'ทุกวัน';
  if(f.freq==='weekly'){const l=(f.days||[]).slice().sort((a,b)=>a-b).map(x=>FDOW[x]);
    return l.length?'ทุกสัปดาห์ · '+l.join(','):'ทุกสัปดาห์ (ยังไม่เลือกวัน)';}
  if(f.freq==='monthly'){const l=(f.monthDays||[]).slice().sort((a,b)=>a-b);
    return l.length?'ทุกเดือน · วันที่ '+l.join(','):'ทุกเดือน (ยังไม่เลือกวัน)';}
  return'';
}
function fixedOccSum(rs,re){
  let inS=0,outS=0;
  (S.fixed||[]).forEach(f=>{
    if(f.on===false||f.type==='transfer')return;
    const n=occDatesInRange(f,rs,re).length;
    if(!n)return;
    if(f.type==='in')inS+=f.amount*n;else outS+=f.amount*n;
  });
  return{in:inS,out:outS};
}
function fixedTotals(){
  const now=new Date();
  return fixedOccSum(new Date(now.getFullYear(),now.getMonth(),1),new Date(now.getFullYear(),now.getMonth()+1,0));
}
function postFixed(f,dateObj){
  if(f.on===false)return false;
  const dk=key(dateObj);
  f.posted=f.posted||{};
  if(f.posted[dk])return false;
  const wid=f.w||(firstPay()||{}).id;
  if(!wid)return false;
  if(f.type==='transfer'){
    if(!f.w2||f.w2===wid)return false;
    S.tx.push({id:uid(),type:'tf',amount:f.amount,note:f.name,date:dk,ts:Date.now(),tm:f.time||nowHM(),
      w:wid,w2:f.w2,tags:[...(f.tagFrom||[]),...(f.tagTo||[])],fx:f.id});
  }else{
    S.tx.push({id:uid(),type:f.type,amount:f.amount,cat:f.cat,note:f.name,date:dk,ts:Date.now(),tm:f.time||nowHM(),
      w:wid,tags:f.tags||[],fx:f.id});
  }
  f.posted[dk]=true;return true;
}

let ppCur=null;
function ppCal(){
  const y=ppCur.getFullYear(),m=ppCur.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7,tk=key(new Date());
  const{s:rs,e:re2}=range();
  let cells='';
  for(let i=0;i<start;i++)cells+='<div class="cell off"></div>';
  for(let d=1;d<=last.getDate();d++){
    const dt=new Date(y,m,d),k=key(dt);
    const inSel=dt>=new Date(rs.getFullYear(),rs.getMonth(),rs.getDate())&&dt<=new Date(re2.getFullYear(),re2.getMonth(),re2.getDate());
    cells+=`<button class="cell ${inSel?'sel':''} ${k===tk?'today':''}" data-ppd="${k}"><span>${d}</span></button>`;}
  return`<div class="row" style="justify-content:center;gap:14px;margin-bottom:8px">
      <button class="tag" data-ppm="-1" style="padding:6px 13px">‹</button>
      <b class="cute" style="font-size:16px">${TH_MF[m]} ${y+543}</b>
      <button class="tag" data-ppm="1" style="padding:6px 13px">›</button></div>
    <div class="cal" style="padding:0">${['จ','อ','พ','พฤ','ศ','ส','อา'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>`;
}
function drawPP(){
  const m=P.mode;let body='';
  if(m==='month'){
    const y=ppCur.getFullYear();
    body=`<div class="row" style="justify-content:center;gap:14px;margin-bottom:10px">
        <button class="tag" data-ppy="-1" style="padding:6px 13px">‹</button>
        <b class="cute" style="font-size:16px">ปี ${y+543}</b>
        <button class="tag" data-ppy="1" style="padding:6px 13px">›</button></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">${TH_MF.map((n,i)=>{
        const b=new Date(y,i+1,0),on=P.cursor.getFullYear()===y&&P.cursor.getMonth()===i;
        return`<button class="cat ${on?'on':''}" data-ppmo="${i}" style="padding:11px 4px"><b style="font-size:13px">${n}</b>
          <span style="font-size:10px">1–${b.getDate()} ${TH_M[i]}</span></button>`;}).join('')}</div>`;
  }else if(m==='year'){
    const cy=new Date().getFullYear();
    body=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">${
      Array.from({length:9},(_,k)=>cy-6+k).map(y=>`<button class="cat ${P.cursor.getFullYear()===y?'on':''}" data-ppyr="${y}" style="padding:14px 4px">
        <b style="font-size:15px">${y+543}</b><span style="font-size:10px">ค.ศ. ${y}</span></button>`).join('')}</div>`;
  }else{
    body=ppCal()+`<div class="info" style="margin-top:10px"><span>💡</span><span>${m==='week'?'แตะวันไหนก็ได้ ระบบจะเลือก<b>ทั้งสัปดาห์</b>ของวันนั้นให้':'แตะวันที่ต้องการดูได้เลย'}</span></div>`;
  }
  openMd(`<h3>📅 เลือก${m==='day'?'วัน':m==='week'?'สัปดาห์':m==='month'?'เดือน':'ปี'}</h3>${body}
    <button class="btn ghost full" id="ppNow" style="margin-top:14px">↩︎ กลับมาปัจจุบัน</button>`);
  const md=$('#md');
  md.querySelectorAll('[data-ppm]').forEach(b=>b.onclick=()=>{ppCur=new Date(ppCur.getFullYear(),ppCur.getMonth()+Number(b.dataset.ppm),1);drawPP();});
  md.querySelectorAll('[data-ppy]').forEach(b=>b.onclick=()=>{ppCur=new Date(ppCur.getFullYear()+Number(b.dataset.ppy),0,1);drawPP();});
  md.querySelectorAll('[data-ppd]').forEach(b=>b.onclick=()=>{P.cursor=parse(b.dataset.ppd);closeMd();render();});
  md.querySelectorAll('[data-ppmo]').forEach(b=>b.onclick=()=>{P.cursor=new Date(ppCur.getFullYear(),Number(b.dataset.ppmo),1);closeMd();render();});
  md.querySelectorAll('[data-ppyr]').forEach(b=>b.onclick=()=>{P.cursor=new Date(Number(b.dataset.ppyr),0,1);closeMd();render();});
  $('#ppNow').onclick=()=>{P.cursor=new Date();closeMd();render();};
}

function tblRows(){
  const y=tblYear||P.cursor.getFullYear();
  const wsel=tblWallets.length?tblWallets:null, csel=tblCats.length?tblCats:null, gsel=tblTags.length?tblTags:null;
  const keep=t=>{
    if(gsel&&!(t.tags||[]).some(x=>gsel.includes(x)))return false;
    if(wsel){ if(t.type==='tf'){if(!wsel.includes(t.w)&&!wsel.includes(t.w2))return false;} else if(!wsel.includes(t.w))return false; }
    if(csel&&(t.type==='in'||t.type==='out')&&!csel.includes(t.cat))return false;
    if(csel&&t.type==='tf')return false;
    return true;
  };
  const rows=[];const now=new Date();
  for(let m=0;m<12;m++){
    const a=new Date(y,m,1),b=new Date(y,m+1,0);
    const l=S.tx.filter(t=>{const d=parse(t.date);return d>=a&&d<=b&&keep(t);});
    const i=sum(l,'in'),o=sum(l,'out'),net=i-o;
    const days=(y===now.getFullYear()&&m===now.getMonth())?now.getDate():b.getDate();
    rows.push({m,name:TH_MF[m],i,o,net,avg:o/Math.max(1,days),save:Math.max(0,net)});
  }
  const tot=rows.reduce((a,r)=>({i:a.i+r.i,o:a.o+r.o,net:a.net+r.net,avg:a.avg+r.avg,save:a.save+r.save}),{i:0,o:0,net:0,avg:0,save:0});
  return{y,rows,tot};
}

function parseCSVText(txt){
  txt=txt.replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','||c===';'){row.push(f);f='';}
    else if(c==='\n'){row.push(f);f='';rows.push(row);row=[];}
    else if(c!=='\r')f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function normDate(v){v=String(v).trim();
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m){let y=+m[1];if(y>2400)y-=543;return`${y}-${pad(+m[2])}-${pad(+m[3])}`;}
  m=v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);if(m){let y=+m[3];if(y>2400)y-=543;return`${y}-${pad(+m[2])}-${pad(+m[1])}`;}
  return null;}

function migrate(){
  if(!S.cats||!S.cats.out)S.cats=JSON.parse(JSON.stringify(DEF_CATS));
  if(S.cats.in&&!S.cats.in.find(c=>c.id==='opening'))S.cats.in.push({g:'อื่นๆ',id:'opening',n:'ยอดยกมา',e:'🏁'});
  S.profile=S.profile||{name:'กระเป๋าตังของฉัน'};
  S.fixed=S.fixed||[];S.goals=S.goals||[];S.debts=S.debts||[];S.lends=S.lends||[];S.memos=S.memos||[];
  S.budgets=S.budgets||{};S.tx=S.tx||[];S.log=Array.isArray(S.log)?S.log:[];S.people=Array.isArray(S.people)?S.people:[];
  S.tags=Array.isArray(S.tags)?S.tags:[];S.buds=Array.isArray(S.buds)?S.buds:[];
  S.tags.forEach(t=>{if(t.col==null)t.col=0;});
  /* งบแบบเก่า (ผูกกับหมวด) -> งบแบบใหม่ ย้ายอัตโนมัติ ตัวเลขคงเดิมทุกบาท */
  if(S.budgets&&Object.keys(S.budgets).length){
    Object.keys(S.budgets).forEach(cid=>{
      const amt=Number(S.budgets[cid])||0;if(amt<=0)return;
      if(S.buds.some(b=>b.legacy===cid))return;
      const c=(S.cats.out||[]).find(x=>x.id===cid);
      S.buds.push({id:uid(),legacy:cid,name:c?c.n:'งบ '+cid,emoji:c?c.e:'🎯',col:c&&c.col!=null?c.col:null,
        amount:amt,period:'month',weekStart:0,from:key(new Date()),to:key(new Date()),repeat:false,
        wallets:[],cats:[cid],tags:[]});
    });
    S.budgets={};
  }
  S.buds.forEach(b=>{b.wallets=b.wallets||[];b.cats=b.cats||[];b.tags=b.tags||[];
    if(!b.period)b.period='month';if(b.weekStart==null)b.weekStart=0;});
  /* รายการประจำแบบเก่า (day: N) -> รอบแบบใหม่ (freq/monthDays) */
  S.fixed.forEach(f=>{
    if(!f.freq){
      const d=Math.max(1,Math.min(31,Number(f.day)||1));
      f.freq='monthly';f.monthDays=[d];f.days=[];
      f.time=f.time||'09:00';
      f.start=f.start||null;   /* ไม่ตั้งวันเริ่ม เพื่อให้รอบเดิมของเดือนนี้ยังนับได้เหมือนเดิม */
      f.end=f.end||null;
      delete f.day;
    }
    f.days=f.days||[];f.monthDays=f.monthDays||[];
    f.tags=f.tags||[];f.tagFrom=f.tagFrom||[];f.tagTo=f.tagTo||[];
    f.note=f.note||'';f.posted=f.posted||{};
    if(f.on===undefined)f.on=true;
    if(!f.w||!walOf(f.w))f.w=(firstPay()||{}).id;
    if(f.type==='transfer'&&(!f.w2||f.w2===f.w))f.on=false;  /* โอนที่ปลายทางหาย = ปิดไว้ก่อน ไม่ให้ลงผิด */
  });
  /* เป้าหมายออมแบบเก่า (target/per/done) -> ตารางออมแบบใหม่ */
  S.goals.forEach(g=>{
    if(!g.kind){
      const per=Number(g.per)||0,T=Number(g.target)||0;
      const n=per>0?Math.max(1,Math.min(365,Math.ceil(T/per))):1;
      g.kind=per>0?'table':'simple';g.period='custom';g.slots=n;g.mode='equal';g.disp='day';
      g.start=g.start||key(new Date());g.filled={};
      for(let i=0;i<Math.min(n,Number(g.done)||0);i++)g.filled[i]=true;
      g.saved=g.kind==='simple'?(Number(g.done)||0)*per:0;
      g.w=g.w||(firstPay()||{}).id;
    }
    g.status=g.status||'active';g.filled=g.filled||{};
    if(g.w&&!walOf(g.w))g.w=(firstPay()||{}).id;
  });
  if(!Array.isArray(S.wallets))S.wallets=[];
  S.wallets.forEach(w=>{ if(w.kind==='ewallet')w.kind='digital'; if(!WKIND[w.kind])w.kind='cash';
    if(!w.cur)w.cur='THB'; if(w.cycMode==null)w.cycMode='first'; });
  const w0=S.wallets[0]?S.wallets[0].id:null;
  if(w0)S.tx.forEach(t=>{if(!t.w)t.w=w0;});
  const ids=HOME_SEC.map(x=>x.id);
  S.homeOrder=(Array.isArray(S.homeOrder)?S.homeOrder.filter(x=>ids.includes(x)):[]);
  ids.forEach(i=>{if(!S.homeOrder.includes(i))S.homeOrder.push(i);});
  S.homeHide=S.homeHide||{};
}
