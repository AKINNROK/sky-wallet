<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8FD0F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sky Wallet">
<title>Sky Wallet — กระเป๋าตังของฉัน</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9F5FE; --card:#FFFFFF; --soft:#F3FAFF; --line:#DCEBF8;
  --ink:#123A63; --ink2:#5B7FA3; --ink3:#94AFC7;
  --sky1:#A6DBFB; --sky2:#63B7F2; --blue:#2C82D8; --deep:#1257A5;
  --in:#0FA37B; --in-s:#DFF5EE; --out:#FF7B89; --out-s:#FFE9EC;
  --gold:#F0A93B; --gold-s:#FFF1DC; --violet:#8A7BD8;
  --shadow:0 4px 20px rgba(38,120,200,.09);
  --cute:'Mali',-apple-system,'Noto Sans Thai',sans-serif;
  --body:'Prompt',-apple-system,'Noto Sans Thai',sans-serif;
}
html[data-theme="dark"]{
  --bg:#0D1926; --card:#152534; --soft:#122030; --line:#233648;
  --ink:#E4F0FA; --ink2:#9BB6CE; --ink3:#6E8AA4;
  --sky1:#2C6B98; --sky2:#2E7FB8; --blue:#63B7F2; --deep:#A6DBFB;
  --in:#4CD3A5; --in-s:#12332A; --out:#FF9AA5; --out-s:#3A2126;
  --gold:#F5C173; --gold-s:#33291A; --violet:#A79BE8;
  --shadow:0 4px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
h1,h2,h3,.cute{font-family:var(--cute)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--sky2);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== hero ===== */
.hero{position:relative;overflow:hidden;padding:16px 18px 74px;background:linear-gradient(165deg,var(--sky1) 0%,var(--sky2) 65%,var(--blue) 100%)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.28)}
.hero::before{width:150px;height:150px;top:-56px;right:-34px}
.hero::after{width:88px;height:88px;top:52px;right:74px;background:rgba(255,255,255,.18)}
.hrow{display:flex;align-items:center;gap:11px;position:relative;z-index:2}
.brandbtn{display:flex;align-items:center;gap:11px;flex:1;text-align:left;min-width:0}
.brandimg{background-image:var(--logo);background-size:cover;background-position:center;background-repeat:no-repeat}
.mark{width:46px;height:46px;border-radius:15px;flex:none;display:block;box-shadow:0 4px 12px rgba(12,60,110,.22);transition:transform .2s}
.brandbtn:active .mark{transform:rotate(-12deg) scale(.94)}
.spin{animation:sp .6s ease}@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.hname{display:block;font-family:var(--cute);font-weight:700;font-size:21px;color:#fff;line-height:1.15;text-shadow:0 2px 6px rgba(14,70,125,.22)}
.hsub{display:block;font-size:11.5px;color:rgba(255,255,255,.92);line-height:1.35}
.hbtn{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.24);display:grid;place-items:center;color:#fff;font-size:17px;flex:none}
.hbtn:hover{background:rgba(255,255,255,.38)}
.syncbtn{position:relative}
.syncbtn svg{width:21px;height:21px;display:block;transition:transform .3s}
.syncbtn .dot{position:absolute;right:5px;bottom:5px;width:10px;height:10px;border-radius:50%;background:#CBD5E1;border:2px solid rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(10,50,100,.25)}
.syncbtn.s-claude .dot{background:#34D399}
.syncbtn.s-local .dot{background:#FBBF24}
.syncbtn.s-memory .dot{background:#FB7185}
.syncbtn.busy svg{animation:spin 1s linear infinite}
.syncbtn.saved{animation:pop .5s ease}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.2)}100%{transform:scale(1)}}
.wallet{position:relative;z-index:2;margin-top:16px;background:rgba(255,255,255,.95);border-radius:20px;padding:14px 17px;box-shadow:0 6px 18px rgba(11,60,112,.16);display:flex;align-items:center;gap:14px}
html[data-theme="dark"] .wallet{background:var(--card)}
.wallet .lab{font-size:12px;color:var(--ink2)}
.wallet .big{font-family:var(--cute);font-weight:700;font-size:26px;color:var(--deep);line-height:1.2}
.wallet .side{margin-left:auto;text-align:right;font-size:12px;color:var(--ink2)}
.sheet-top{margin-top:-56px;border-radius:28px 28px 0 0;background:var(--bg);padding:16px 16px 112px;position:relative;z-index:3}
main{max-width:760px;margin:0 auto}

/* ===== nav ===== */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:flex-end;gap:2px;background:var(--card);border-radius:22px 22px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(30,100,170,.12)}
nav.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 1px;border-radius:13px;font-size:9.5px;color:var(--ink3);font-weight:500;white-space:nowrap}
nav.tabs button .ne{font-size:17px;line-height:1.15;filter:grayscale(.55);opacity:.75}
nav.tabs button.on{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff;font-weight:600}
nav.tabs button.on .ne{filter:none;opacity:1}
nav.tabs button.fab{flex:none;width:54px;height:54px;border-radius:50%;background:linear-gradient(160deg,var(--sky1),var(--blue));color:#fff;font-size:27px;justify-content:center;box-shadow:0 6px 18px rgba(44,130,216,.45);margin:0 3px}
nav.tabs button.fab .ne{filter:none;opacity:1;font-size:29px;font-weight:300}
nav.tabs button.fab .dk{display:none}
.navbrand{display:none}
@media (min-width:900px){
  .hero{padding-left:250px}
  .sheet-top{padding:16px 26px 40px 250px}
  main{max-width:820px;margin:0}
  nav.tabs{top:0;bottom:0;right:auto;width:216px;flex-direction:column;align-items:stretch;gap:4px;border-radius:0 26px 26px 0;padding:22px 14px;justify-content:flex-start;box-shadow:6px 0 24px rgba(30,100,170,.1)}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:11px 14px;border-radius:16px}
  nav.tabs button.fab{width:auto;height:auto;border-radius:16px;justify-content:flex-start;font-size:14.5px;margin:6px 0}
  nav.tabs button.fab .dk{display:inline}
  nav.tabs button.fab .ne{font-size:20px}
  .navbrand{display:flex!important;align-items:center;gap:10px;padding:4px 8px 18px}
  .navbrand .lg{width:34px;height:34px;border-radius:11px;flex:none}
  .navbrand b{font-family:var(--cute);font-weight:700;font-size:17px;color:var(--deep);line-height:1.1}
  .navbrand span.sb{display:block;font-size:11px;color:var(--ink3);font-weight:400}
}

/* ===== bits ===== */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:16px}
h2.sec{font-size:16.5px;font-weight:600;margin:22px 0 10px;display:flex;align-items:center;gap:7px}
h2.sec:first-child{margin-top:4px}
.muted{color:var(--ink2)}.tiny{font-size:12.5px}.pos{color:var(--in)}.neg{color:var(--out)}
.row{display:flex;align-items:center;gap:11px}
.scroller{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.scroller::-webkit-scrollbar{display:none}
.pill{background:var(--card);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap;box-shadow:var(--shadow)}
.pill.on{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff;font-weight:600}
.segs{display:flex;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--shadow);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.segs button{flex:1 0 auto;padding:9px 13px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.segs button.on{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff;font-weight:600}
.segs.in button.on{background:linear-gradient(160deg,#5FD6B4,var(--in))}
.segs.out button.on{background:linear-gradient(160deg,#FFA3AC,var(--out))}
.btn{background:linear-gradient(160deg,var(--sky2),var(--blue));color:#fff;border-radius:16px;padding:13px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(44,130,216,.28)}
.btn.full{width:100%}
.btn.ghost{background:var(--soft);color:var(--blue);box-shadow:none;border:1.5px solid var(--line)}
.btn.warn{background:linear-gradient(160deg,#FFA3AC,var(--out));box-shadow:none}
.btn:active{transform:translateY(1px)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:15px;background:var(--soft);color:var(--ink)}
label.f{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 6px 3px}
.field+.field{margin-top:12px}
.periodbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.periodbar .nav{width:36px;height:36px;border-radius:13px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--blue);font-weight:600}
.periodbar .lab{flex:1;text-align:center;font-weight:600;font-family:var(--cute)}
.empty{text-align:center;padding:34px 20px;color:var(--ink2)}
.empty .em{font-size:38px}
.empty .big{font-family:var(--cute);font-weight:600;color:var(--ink);margin:6px 0 3px}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.trio div{padding:13px 8px;text-align:center}
.trio div+div{border-left:1.5px solid var(--line)}
.trio .k{font-size:11.5px;color:var(--ink2)}
.trio .v{font-family:var(--cute);font-weight:700;font-size:17px;margin-top:1px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 15px;width:100%;text-align:left;border-bottom:1.5px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--soft)}
.tx .ic{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12px;color:var(--ink3)}
.tx .amt{font-weight:600;white-space:nowrap}
.daysep{padding:9px 15px;font-size:12.5px;color:var(--ink2);background:var(--soft);display:flex;justify-content:space-between;font-weight:500}
.bubwrap{padding:6px 4px 2px}
.bub{width:100%;display:block}
.bub circle{cursor:pointer}
.bubhint{text-align:center;font-size:12.5px;color:var(--ink2);min-height:20px;padding:2px 12px 10px}
.bline{padding:12px 15px;border-bottom:1.5px solid var(--line)}
.bline:last-child{border-bottom:0}
.track{height:9px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sky1),var(--blue))}
.fill.warn{background:linear-gradient(90deg,#FFD08A,var(--gold))}
.fill.over{background:linear-gradient(90deg,#FFB0B8,var(--out))}
.fill.save{background:linear-gradient(90deg,#7FE3C4,var(--in))}
.tag{font-size:11px;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap;display:inline-block}
.tag.ok{background:var(--in-s);color:var(--in)}
.tag.wait{background:var(--gold-s);color:var(--gold)}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:16px;padding:0 14px;box-shadow:var(--shadow);margin-bottom:12px}
.searchbar input{border:0;background:transparent;padding:12px 0;flex:1;min-width:0}
.selwrap{display:flex;align-items:center;gap:9px;background:var(--soft);border:1.5px solid var(--line);border-radius:15px;padding:0 13px}
.selwrap .em{font-size:20px;flex:none}
.selwrap select{flex:1;border:0;background:transparent;padding:12px 0;font-weight:500;appearance:none;-webkit-appearance:none;min-width:0}
.selwrap .ar{color:var(--blue);font-size:13px;flex:none}

/* ===== calendar ===== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:4px 10px 12px}
.cal .dow{text-align:center;font-size:11px;color:var(--ink3);padding:5px 0}
.cal .cell{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--ink2);background:var(--soft)}
.cal .cell.off{background:transparent;color:var(--ink3);opacity:.35}
.cal .cell.today{outline:2px solid var(--sky2)}
.cal .cell.sel{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff;font-weight:600}
.cal .cell .dots{display:flex;gap:2px;height:5px}
.cal .cell i{width:5px;height:5px;border-radius:50%;display:block}

/* ===== wallets ===== */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:13px 14px;text-align:left;border:2px solid transparent}
.wcard.on{border-color:var(--sky2)}
.wcard .e{font-size:22px}
.wcard .n{font-weight:600;font-size:14px;margin-top:3px}
.wcard .b{font-family:var(--cute);font-weight:700;font-size:19px;margin-top:1px}
.wcard.add{display:grid;place-items:center;color:var(--blue);border:2px dashed var(--line);box-shadow:none;background:transparent;min-height:96px}

/* ===== menu tiles ===== */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:12px 8px;margin-bottom:12px}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:16px;font-size:11px;color:var(--ink2);line-height:1.25;text-align:center;font-weight:500}
.tiles button:hover{background:var(--soft)}
.tiles button .e{font-size:24px}
.mlist button{display:flex;align-items:center;gap:13px;width:100%;padding:14px 16px;border-bottom:1.5px solid var(--line);text-align:left}
.mlist button:last-child{border-bottom:0}
.mlist .e{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.mlist .t{flex:1}
.mlist .t b{display:block;font-weight:600;font-size:14.5px}
.mlist .t span{font-size:12px;color:var(--ink3)}
.subhead{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.subhead .bk{width:38px;height:38px;border-radius:13px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--blue);flex:none}
.subhead b{font-family:var(--cute);font-size:19px;font-weight:700}

/* ===== full-screen add ===== */
.addscreen{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:var(--bg)}
.addtop{flex:none;background:linear-gradient(165deg,var(--sky1),var(--sky2));padding:calc(10px + env(safe-area-inset-top)) 10px 12px;display:flex;align-items:center;gap:6px}
.addtop .tb{flex:1;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.addtop .tb::-webkit-scrollbar{display:none}
.addtop .tb button{padding:8px 13px;border-radius:999px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.9);white-space:nowrap}
.addtop .tb button.on{background:#fff;color:var(--deep);font-weight:600}
.addtop .x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--deep);display:grid;place-items:center;font-size:17px;flex:none}
.addbody{flex:1;overflow-y:auto;padding:12px 14px 6px;-webkit-overflow-scrolling:touch}
.addfoot{flex:none;background:var(--card);border-radius:22px 22px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(30,100,170,.14)}
.catbox{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.catbox .hd{display:flex;align-items:center;gap:6px;padding:11px 13px 6px}
.catbox .hd .ttl{flex:1;font-size:13px;color:var(--ink2);font-weight:500}
.catbox .hd button{width:32px;height:32px;border-radius:11px;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-size:14px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:7px;padding:4px 11px 13px}
.cat{background:var(--soft);border-radius:15px;padding:9px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ink2);line-height:1.25;text-align:center;border:2px solid transparent}
.cat .e{font-size:21px}
.cat.on{border-color:var(--sky2);background:linear-gradient(165deg,#EAF6FE,#D6ECFB);color:var(--deep);font-weight:600}
.cat .e{width:34px;height:34px;border-radius:12px;display:grid;place-items:center}
.swatch{display:flex;gap:7px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:9px}
.swatch button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:transparent;font-size:15px;font-weight:700;border:2px solid transparent}
.swatch button.on{color:#123A63;border-color:var(--sky2)}
html[data-theme="dark"] .cat.on{background:var(--line)}
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.chiprow::-webkit-scrollbar{display:none}
.chiprow button{background:var(--soft);border:1.5px solid var(--line);border-radius:13px;padding:7px 12px;font-size:12.5px;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.amtbar{display:flex;align-items:center;gap:10px;background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:9px 14px;margin-bottom:8px}
.amtbar .eq{font-size:12px;color:var(--ink3);white-space:nowrap;flex:none}
.amtbar .disp{flex:1;text-align:right;font-family:var(--cute);font-weight:700;font-size:27px;line-height:1.2;overflow:hidden;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{background:var(--soft);border-radius:14px;padding:12px 0;font-size:18px;font-weight:500}
.keys button.op{color:var(--blue)}
.keys button.go{grid-column:span 2;background:linear-gradient(160deg,var(--sky2),var(--blue));color:#fff;font-size:15px;font-weight:600}
.keys button.go.inmode{background:linear-gradient(160deg,#5FD6B4,var(--in))}
.keys button.go.tfmode{background:linear-gradient(160deg,#A79BE8,var(--violet))}
.wsel{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:11px 14px;width:100%;text-align:left;margin-bottom:10px}
.wsel .e{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.wsel .t{flex:1;min-width:0}
.wsel .t b{display:block;font-size:14.5px}
.wsel .t span{font-size:12px;color:var(--ink3)}
.arrowmid{text-align:center;color:var(--blue);font-size:18px;margin:-4px 0 6px}
.info{background:var(--soft);border:1.5px solid var(--line);border-radius:15px;padding:11px 13px;font-size:12.5px;color:var(--ink2);display:flex;gap:9px}
.info.warn{background:var(--out-s);border-color:transparent;color:var(--out)}

/* ===== savings / debt slots ===== */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:7px;margin-top:12px}
.slot{aspect-ratio:1;border-radius:16px;background:var(--soft);border:2px dashed var(--line);display:grid;place-items:center;font-size:11.5px;color:var(--ink3);font-weight:500}
.slot.done{background:linear-gradient(160deg,var(--sky1),var(--sky2));border:2px solid transparent;color:#fff;font-size:17px}
.dslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px;margin-top:11px}
.dslot{border-radius:13px;background:var(--soft);border:1.5px dashed var(--line);padding:8px 4px;text-align:center;font-size:11.5px;color:var(--ink3);font-weight:500}
.dslot.done{background:linear-gradient(160deg,var(--sky1),var(--sky2));border:1.5px solid transparent;color:#fff}
.dslot b{display:block;font-size:10px;opacity:.8;font-weight:400}
.fx{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1.5px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx .ic{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}

/* ===== modal ===== */
.ov{position:fixed;inset:0;background:rgba(12,45,80,.42);z-index:80;display:none}
.ov.open{display:block}
.md{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;display:none}
.md.open{display:block;animation:up .2s ease}
@keyframes up{from{transform:translateY(16px)}to{transform:none}}
@media (min-width:700px){.md{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:470px;border-radius:24px}.md.open{animation:none}}
.md h3{margin:0 0 14px;font-size:18px;display:flex;align-items:center;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{background:var(--soft);border:1.5px solid var(--line);border-radius:14px;padding:9px 13px;font-size:13px;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.opt.on{border-color:var(--sky2);color:var(--deep);font-weight:500}
.opt .ck{width:20px;height:20px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;color:transparent}
.opt.on .ck{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:#fff}
.emopick{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-height:150px;overflow-y:auto;background:var(--soft);border-radius:14px;padding:8px}
.emopick button{aspect-ratio:1;border-radius:10px;font-size:19px}
.emopick button.on{background:linear-gradient(160deg,var(--sky1),var(--sky2))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:95;background:var(--deep);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 6px 20px rgba(10,50,100,.3);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-8px)}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:99;color:var(--ink2);font-family:var(--cute)}
#loading .lg{width:84px;height:84px;border-radius:26px;box-shadow:0 8px 24px rgba(40,120,200,.22);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style>
</head>

  init(){ if(window.storage&&typeof window.storage.get==='function'){this.mode='claude';return;}
    try{localStorage.setItem('__sw','1');localStorage.removeItem('__sw');this.mode='local';}catch(e){this.mode='memory';} },
  async get(k){ if(this.mode==='claude'){try{const r=await window.storage.get(k);return r?r.value:null;}catch(e){return null;}}
    if(this.mode==='local'){try{return localStorage.getItem(k);}catch(e){return null;}} return this.mem[k]??null; },
  async set(k,v){ if(this.mode==='claude'){try{await window.storage.set(k,v);return true;}catch(e){return false;}}
    if(this.mode==='local'){try{localStorage.setItem(k,v);return true;}catch(e){return false;}} this.mem[k]=v;return true; }
};

async function flushSave(){
  clearTimeout(saveT);
  const raw=JSON.stringify(S);
  if(raw===lastRaw)return true;
  const ok=await Store.set(KEY,raw);
  if(ok){lastRaw=raw;lastSave=new Date();paintSync(true);}
  return ok;
}
function hardSave(){ // synchronous fallback when the app is closing
  try{if(Store.mode==='local'){const raw=JSON.stringify(S);localStorage.setItem(KEY,raw);lastRaw=raw;}}catch(e){}
  flushSave();
}
async function autoPull(silent){
  if(pulling)return;
  try{if($('#md')&&$('#md').classList.contains('open'))return;}catch(e){}
  pulling=true;
  try{
    const raw=await Store.get(KEY);
    if(raw&&raw!==lastRaw){
      const d=JSON.parse(raw);
      S={...S,...d};migrate();lastRaw=raw;lastSave=new Date();

      render();paintSync(true);

}

const walOf=id=>S.wallets.find(w=>w.id===id)||S.wallets[0];
function walBal(id){
  const w=walOf(id); if(!w)return 0;
  let b=Number(w.open||0);
  S.tx.forEach(t=>{
    if(t.type==='in'&&t.w===id)b+=t.amount;
    else if(t.type==='out'&&t.w===id)b-=t.amount;
    else if(t.type==='tf'){ if(t.w===id)b-=t.amount; if(t.w2===id)b+=t.amount; }
    else if(t.type==='adj'&&t.w===id)b+=t.amount;
  });
  return b;
}
const totalBal=()=>S.wallets.reduce((a,w)=>a+walBal(w.id),0);

let P={mode:'day',cursor:new Date()};
let homeSide='out', homeWallet='all', txSide='all', txQ='', repSide='out';
let planTab='fixed', catTab='out', catQ='', DID=null;
function range(){
  const c=new Date(P.cursor.getFullYear(),P.cursor.getMonth(),P.cursor.getDate());
  if(P.mode==='day')return{s:c,e:c};
  if(P.mode==='week'){const off=(c.getDay()+6)%7;const s=new Date(c);s.setDate(c.getDate()-off);const e=new Date(s);e.setDate(s.getDate()+6);return{s,e};}
  if(P.mode==='month')return{s:new Date(c.getFullYear(),c.getMonth(),1),e:new Date(c.getFullYear(),c.getMonth()+1,0)};
  return{s:new Date(c.getFullYear(),0,1),e:new Date(c.getFullYear(),11,31)};
}
function rangeLabel(){const{s,e}=range();
  if(P.mode==='day')return(key(new Date())===key(s)?'วันนี้ · ':'')+`${TH_D[s.getDay()]} ${dLab(s)}`;
  if(P.mode==='week')return`${s.getDate()} ${TH_M[s.getMonth()]} – ${e.getDate()} ${TH_M[e.getMonth()]} ${(e.getFullYear()+543)%100}`;
  if(P.mode==='month')return`${TH_MF[s.getMonth()]} ${s.getFullYear()+543}`;
  return`ปี ${s.getFullYear()+543}`;}
function step(dir){const c=P.cursor;const m=(SUB==='report'||SUB==='budget'||TAB==='report'||(TAB==='plan'&&planTab!=='fixed'))?'month':P.mode;
  if(m==='day')c.setDate(c.getDate()+dir); else if(m==='week')c.setDate(c.getDate()+7*dir);
  else if(m==='month'){c.setDate(1);c.setMonth(c.getMonth()+dir);} else c.setFullYear(c.getFullYear()+dir);
  P.cursor=new Date(c);render();}
function txIn(s,e,wf){

    if(wf&&wf!=='all'){ if(t.type==='tf')return t.w===wf||t.w2===wf; return t.w===wf; }
    return true;}).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.ts-a.ts);
}
const sum=(l,t)=>l.filter(x=>x.type===t).reduce((a,b)=>a+b.amount,0);
function byCat(list,type){const m={};list.filter(t=>t.type===type).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amount);
  return Object.entries(m).map(([k,v])=>({k,v,c:catOf(k,type)})).sort((a,b)=>b.v-a.v);}
function calcExpr(x){
  const tk=String(x).match(/(\d+\.?\d*|[+\-*/])/g);if(!tk)return 0;
  const a=[];for(let i=0;i<tk.length;i++){const t=tk[i];
    if(t==='*'||t==='/'){const b=parseFloat(tk[++i]||'0');const p=a.pop()||0;a.push(t==='*'?p*b:(b?p/b:0));}
    else a.push(t==='+'||t==='-'?t:parseFloat(t));}
  let r=typeof a[0]==='number'?a[0]:0;
  for(let i=1;i<a.length;i+=2){const op=a[i],v=Number(a[i+1])||0;r=op==='-'?r-v:r+v;}
  return Math.round(r*100)/100;
}

/* =========== BUBBLES =========== */
function bubbles(items,total,type){
  if(!items.length)return`<div class="empty"><div class="em">${type==='in'?'💰':'🫧'}</div><div class="big">ยังไม่มี${type==='in'?'รายรับ':'รายจ่าย'}ในช่วงนี้</div><div class="tiny">กดปุ่ม ＋ เพื่อบันทึกรายการแรก</div></div>`;
  const list=items.slice(0,11),maxV=list[0].v,rad=v=>20+40*Math.sqrt(v/maxV);
  const P0={x:0,y:0,r:rad(list[0].v),d:list[0]},placed=[P0],rest=list.slice(1);
  let prevR=P0.r;
  [rest.slice(0,7),rest.slice(7)].forEach(ring=>{
    if(!ring.length)return;
    const rs=ring.map(d=>rad(d.v)),ringR=prevR+Math.max(...rs)+9,tot=rs.reduce((a,b)=>a+b,0);
    let ang=-Math.PI/2;
    ring.forEach((d,i)=>{const sh=2*Math.PI*(rs[i]/tot),a=ang+sh/2;
      placed.push({x:Math.cos(a)*ringR,y:Math.sin(a)*ringR,r:rs[i],d});ang+=sh;});
    prevR=ringR+Math.max(...rs);
  });
  const minX=Math.min(...placed.map(p=>p.x-p.r))-4,maxX=Math.max(...placed.map(p=>p.x+p.r))+4;
  const minY=Math.min(...placed.map(p=>p.y-p.r))-4,maxY=Math.max(...placed.map(p=>p.y+p.r))+4;
  let sv=`<svg class="bub" viewBox="${minX} ${minY} ${maxX-minX} ${maxY-minY}" style="max-height:340px">`;
  placed.forEach((p,i)=>{const c=palColor(items.indexOf(p.d));
    sv+=`<g><circle cx="${p.x}" cy="${p.y}" r="${p.r}" style="fill:${c}" data-bub="${p.d.k}"/>`;
    const fs=Math.max(6,Math.min(11,p.r*.26));
    if(p.r>26)sv+=`<text x="${p.x}" y="${p.y-p.r*.14}" text-anchor="middle" style="font-size:${fs*1.5}px;pointer-events:none">${p.d.c.e}</text>`;
    if(p.r>32)sv+=`<text x="${p.x}" y="${p.y+p.r*.3}" text-anchor="middle" style="font-size:${fs}px;fill:#123A63;font-weight:600;pointer-events:none">${esc(p.d.c.n)}</text>`;
    sv+=`<text x="${p.x}" y="${p.r>32?p.y+p.r*.3+fs*1.15:(p.r>26?p.y+p.r*.42:p.y+fs*.35)}" text-anchor="middle" style="font-size:${fs*1.05}px;fill:#123A63;font-weight:700;pointer-events:none">${money(p.d.v)}</text></g>`;});
  return`<div class="bubwrap">${sv}</svg></div><div class="bubhint" id="bubhint">แตะวงกลมเพื่อดูรายละเอียด · แสดง ${list.length} จาก ${items.length} หมวด</div>`;
}

  const start=(first.getDay()+6)%7, tk=key(new Date()), sk=key(c);

function secTrend(){
  const c=P.cursor,y=c.getFullYear(),m=c.getMonth(),last=new Date(y,m+1,0).getDate();
  const now=new Date(),cur=(now.getFullYear()===y&&now.getMonth()===m);
  const today=cur?now.getDate():last;
  const daily=new Array(last).fill(0);
  txIn(new Date(y,m,1),new Date(y,m+1,0),homeWallet).filter(t=>t.type==='out')
    .forEach(t=>{daily[parse(t.date).getDate()-1]+=t.amount;});
  let acc=0;const cum=daily.map(v=>acc+=v);
  const spent=cum[today-1]||0;
  let prev3=0,cnt=0;
  for(let k=1;k<=3;k++){const a=new Date(y,m-k,1),b=new Date(y,m-k+1,0);
    const v=sum(txIn(a,b,homeWallet),'out'); if(v>0){prev3+=v;cnt++;}}
  const avg3=cnt?prev3/cnt:0;
  const proj=today?Math.round(spent/today*last):0;
  const mx=Math.max(1,...cum,avg3);
  const W=320,H=96;
  const pts=cum.slice(0,today).map((v,i)=>`${(i/(last-1))*W},${H-(v/mx)*H}`).join(' ');
  const avgY=H-(avg3/mx)*H;
  return`<h2 class="sec">📈 แนวโน้มค่าใช้จ่าย <span class="tiny muted" style="font-weight:400">${TH_MF[m]}</span></h2>
   <div class="card" style="margin-bottom:12px"><div style="padding:14px 14px 4px">
    <svg viewBox="0 0 ${W} ${H+4}" preserveAspectRatio="none" style="width:100%;height:110px;display:block">
      <line x1="0" y1="${avgY}" x2="${W}" y2="${avgY}" style="stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4"/>
      ${pts?`<polyline points="${pts}" style="fill:none;stroke:var(--sky2);stroke-width:2.5;stroke-linejoin:round"/>`:''}
      <line x1="0" y1="${H}" x2="${W}" y2="${H}" style="stroke:var(--line);stroke-width:1.5"/>
    </svg>
    <div class="row tiny muted" style="margin-top:4px"><span>1 ${TH_M[m]}</span><span style="margin-left:auto">${last} ${TH_M[m]}</span></div></div>
    <div class="trio" style="box-shadow:none;border-radius:0;border-top:1.5px solid var(--line)">
      <div><div class="k">ใช้ไปแล้ว</div><div class="v neg num">${money(spent)}</div></div>
      <div><div class="k">คาดการณ์สิ้นเดือน</div><div class="v num" style="color:var(--gold)">${money(proj)}</div></div>
      <div><div class="k">เฉลี่ย 3 เดือนก่อน</div><div class="v num">${money(avg3)}</div></div>
    </div></div>`;
}

/* =========== SUB PAGES =========== */
let INPLAN=false;
function subHead(t,extra){
  if(INPLAN)return extra?`<div class="row" style="justify-content:flex-end;margin-bottom:10px">${extra}</div>`:'';
  return`<div class="subhead"><button class="bk" data-go="menu">‹</button><b>${t}</b>
  <span style="flex:1"></span>${extra||''}</div>`;}
function viewPlan(){
  const T=[['fixed','📌 รายการประจำ'],['budget','🎯 งบรายหมวด'],['save','🐷 ออมเงิน'],['debt','💳 ผ่อน/หนี้'],['cycle','🧾 รอบบิลบัตร']];
  let h=`<div class="row" style="margin-bottom:10px"><b class="cute" style="font-size:19px;flex:1">🎯 วางแผนการเงิน</b></div>`;
  h+=`<div class="segs">${T.map(([k,n])=>`<button data-plan="${k}" class="${planTab===k?'on':''}">${n}</button>`).join('')}</div>`;
  INPLAN=true;
  try{h+=planTab==='budget'?viewBudget():planTab==='save'?viewSave():planTab==='debt'?viewDebt():planTab==='cycle'?viewCycle():viewFixed();}
  finally{INPLAN=false;}
  return h;
}

function viewReport(){
  const c=P.cursor,mS=new Date(c.getFullYear(),c.getMonth(),1),mE=new Date(c.getFullYear(),c.getMonth()+1,0);
  const pS=new Date(c.getFullYear(),c.getMonth()-1,1),pE=new Date(c.getFullYear(),c.getMonth(),0);
  const cur=txIn(mS,mE,homeWallet),prv=txIn(pS,pE,homeWallet);
  const ci=sum(cur,'in'),co=sum(cur,'out'),pi=sum(prv,'in'),po=sum(prv,'out');
  const dl=(a,b)=>b===0?null:Math.round((a-b)/b*100);

  h+=`<div class="periodbar"><button class="nav" data-step="-1">‹</button><div class="lab">${TH_MF[mS.getMonth()]} ${mS.getFullYear()+543}</div><button class="nav" data-step="1">›</button></div>`;
  h+=`<div class="trio"><div><div class="k">รายรับ</div><div class="v pos num">${money(ci)}</div><div class="tiny muted">${dl(ci,pi)===null?'—':(dl(ci,pi)>=0?'▲':'▼')+Math.abs(dl(ci,pi))+'%'}</div></div>

  h+=`<h2 class="sec">🍩 สัดส่วนตามหมวด</h2><div class="segs ${repSide}"><button data-rside="out" class="${repSide==='out'?'on':''}">รายจ่าย</button><button data-rside="in" class="${repSide==='in'?'on':''}">รายรับ</button></div><div class="card pad">`;
  if(!tot)h+=`<div class="empty"><div class="em">📭</div><div class="big">ไม่มีข้อมูล${repSide==='in'?'รายรับ':'รายจ่าย'}เดือนนี้</div></div>`;
  else{const R=52,C=2*Math.PI*R;let off=0,arcs='';
    items.slice(0,12).forEach((it,i)=>{const len=it.v/tot*C;
      arcs+=`<circle cx="70" cy="70" r="${R}" style="fill:none;stroke:${palColor(i)};stroke-width:22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;});
    h+=`<div style="display:flex;justify-content:center"><svg width="150" height="150" viewBox="0 0 140 140">${arcs}
      <circle cx="70" cy="70" r="41" style="fill:var(--card)"/>
      <text x="70" y="68" text-anchor="middle" style="font-size:16px;font-weight:700;fill:var(--ink);font-family:var(--cute)">${money(tot)}</text>
      <text x="70" y="84" text-anchor="middle" style="font-size:9.5px;fill:var(--ink3)">บาท</text></svg></div>
      <div style="margin-top:12px">${items.slice(0,12).map((it,i)=>`<div class="row" style="padding:6px 0">
        <span style="width:13px;height:13px;border-radius:5px;background:${palColor(i)};flex:none"></span>
        <span style="flex:1">${it.c.e} ${esc(it.c.n)}</span>
        <span class="tiny muted num">${Math.round(it.v/tot*100)}%</span>
        <span class="num" style="min-width:78px;text-align:right;font-weight:600">${money(it.v)}</span></div>`).join('')}</div>`;}
  h+=`</div><h2 class="sec">📈 ย้อนหลัง 6 เดือน</h2><div class="card"><div style="padding:16px 14px 4px">`;
  const ms=[];for(let k=5;k>=0;k--){const a=new Date(c.getFullYear(),c.getMonth()-k,1),b=new Date(c.getFullYear(),c.getMonth()-k+1,0);
    const t=txIn(a,b,homeWallet);ms.push({l:TH_M[a.getMonth()].replace('.',''),i:sum(t,'in'),o:sum(t,'out')});}

  ms.forEach((x,i)=>{const cw=(340-5*11)/6,cx=i*(cw+11),bw=(cw-5)/2;
    sv+=`<rect x="${cx}" y="${108-x.i/mx*100}" width="${bw}" height="${Math.max(x.i/mx*100,1.5)}" rx="3" style="fill:var(--in)"/>`;
    sv+=`<rect x="${cx+bw+5}" y="${108-x.o/mx*100}" width="${bw}" height="${Math.max(x.o/mx*100,1.5)}" rx="3" style="fill:var(--out)"/>`;});
  h+=sv+`</svg><div style="display:flex;margin-top:5px">${ms.map(x=>`<span style="flex:1;text-align:center;font-size:11px;color:var(--ink3)">${x.l}</span>`).join('')}</div>
    <div class="bubhint"><span style="color:var(--in)">●</span> รายรับ &nbsp; <span style="color:var(--out)">●</span> รายจ่าย</div></div></div>`;
  h+=`<h2 class="sec">📤 ดึงรายงานออกไปใช้</h2><div class="scroller" style="gap:8px;padding-bottom:10px">
    <button class="pill" data-export="1">⬇️ ส่งออกข้อมูล</button></div>`;
  return h;

function viewBudget(){
  const c=P.cursor,now=new Date();
  const mS=new Date(c.getFullYear(),c.getMonth(),1),mE=new Date(c.getFullYear(),c.getMonth()+1,0);
  const cur=txIn(mS,mE,'all');const spent={};cur.filter(t=>t.type==='out').forEach(t=>spent[t.cat]=(spent[t.cat]||0)+t.amount);
  const totB=Object.values(S.budgets).reduce((a,b)=>a+Number(b||0),0);
  const usedB=Object.keys(S.budgets).reduce((a,k)=>a+(spent[k]||0),0),left=totB-usedB;
  const sameM=now.getMonth()===c.getMonth()&&now.getFullYear()===c.getFullYear();
  const daysLeft=sameM?Math.max(1,mE.getDate()-now.getDate()+1):mE.getDate();
  let h=subHead('🎯 งบประมาณ');
  h+=`<div class="periodbar"><button class="nav" data-step="-1">‹</button><div class="lab">${TH_MF[mS.getMonth()]} ${mS.getFullYear()+543}</div><button class="nav" data-step="1">›</button></div>`;
  h+=`<div class="card pad" style="background:linear-gradient(160deg,#EAF6FE,#D9EDFB)">
    <div class="tiny muted">งบคงเหลือเดือนนี้</div>
    <div class="cute" style="font-size:29px;font-weight:700;color:${left<0?'var(--out)':'var(--deep)'}">฿${money(left)}</div>
    <div class="tiny muted">${totB?`ใช้ได้อีกวันละ ฿${money(Math.max(0,left)/daysLeft)} · เหลือ ${daysLeft} วัน`:'ยังไม่ได้ตั้งงบ เลือกหมวดด้านล่างได้เลย'}</div>
    <div class="track" style="height:11px"><div class="fill ${usedB>totB?'over':usedB/(totB||1)>.8?'warn':''}" style="width:${totB?Math.min(100,usedB/totB*100):0}%"></div></div>
    <div class="row tiny muted" style="margin-top:6px"><span>ใช้ไป ฿${money(usedB)}</span><span style="margin-left:auto">งบ ฿${money(totB)}</span></div></div>`;
  const set=S.cats.out.filter(x=>S.budgets[x.id]);
  h+=`<h2 class="sec">งบที่ตั้งไว้</h2><div class="card">`;
  if(!set.length)h+=`<div class="empty"><div class="em">🎯</div><div class="big">ยังไม่ได้ตั้งงบ</div><div class="tiny">เลือกหมวดจากด้านล่างเพื่อกำหนดงบต่อเดือน</div></div>`;
  else set.forEach(x=>{const b=Number(S.budgets[x.id]),sp=spent[x.id]||0;
    h+=`<div class="bline"><div class="row"><span style="flex:1">${x.e} ${esc(x.n)}</span>
      <span class="num tiny ${sp>b?'neg':'muted'}">${money(sp)} / ${money(b)}</span>
      <button class="tag" data-budget="${x.id}">แก้</button></div>
      <div class="track"><div class="fill ${sp>b?'over':sp/b>.8?'warn':''}" style="width:${Math.min(100,sp/b*100)}%"></div></div>
      ${sp>b?`<div class="tiny neg" style="margin-top:5px">เกินงบ ฿${money(sp-b)} 😥</div>`:''}</div>`;});
  h+=`</div><h2 class="sec">➕ เพิ่มงบหมวดอื่น</h2><div class="scroller" style="flex-wrap:wrap;gap:7px;padding-bottom:12px">
    ${S.cats.out.filter(x=>!S.budgets[x.id]).map(x=>`<button class="pill" data-budget="${x.id}">${x.e} ${esc(x.n)}</button>`).join('')}</div>`;
  return h;
}
function viewSave(){
  let h=subHead('🐷 ออมเงิน','<button class="pill" data-newgoal="1">＋ เป้าหมาย</button>');
  if(!S.goals.length)return h+`<div class="card"><div class="empty"><div class="em">🐷</div><div class="big">ยังไม่มีเป้าหมายออมเงิน</div>
    <div class="tiny">เช่น กองทุนฉุกเฉิน 100,000 · เที่ยวญี่ปุ่น 50,000<br>แบ่งเป็นช่องๆ แล้วแตะทีละช่องเวลาหยอดเงิน</div></div></div>`;
  S.goals.forEach(g=>{const slots=Math.max(1,Math.ceil(g.target/g.per)),done=Math.min(slots,g.done||0);
    const saved=done*g.per,p=Math.min(100,saved/g.target*100),C=Math.PI*52,len=C*p/100;
    h+=`<div class="card pad" style="margin-bottom:14px">
      <div class="row"><span style="font-size:22px">${g.emoji||'🐷'}</span><span style="flex:1;font-weight:600">${esc(g.name)}</span>
        <button class="tag" data-editgoal="${g.id}">แก้ไข</button></div>
      <div class="row" style="margin-top:10px;gap:14px;flex-wrap:wrap">
        <svg width="140" height="82" viewBox="0 0 140 82" style="flex:none">
          <path d="M18 74 A52 52 0 0 1 122 74" style="fill:none;stroke:var(--soft);stroke-width:13;stroke-linecap:round"/>
          <path d="M18 74 A52 52 0 0 1 122 74" style="fill:none;stroke:var(--sky2);stroke-width:13;stroke-linecap:round" stroke-dasharray="${len} ${C}"/>
          <text x="70" y="56" text-anchor="middle" style="font-size:19px;font-weight:700;fill:var(--deep);font-family:var(--cute)">${Math.round(p)}%</text>
          <text x="70" y="72" text-anchor="middle" style="font-size:10px;fill:var(--ink3)">${money(saved)} / ${money(g.target)}</text></svg>
        <div style="flex:1;min-width:150px"><div class="tiny muted">เหลืออีก</div>
          <div class="cute" style="font-size:23px;font-weight:700;color:var(--deep)">฿${money(Math.max(0,g.target-saved))}</div>
          <div class="tiny muted">ช่องละ ฿${money(g.per)} · หยอดแล้ว ${done}/${slots} ช่อง</div></div></div>
      <div class="tiny muted" style="margin-top:10px">แตะช่องเพื่อบันทึกการหยอดเงิน</div>
      <div class="slots">${Array.from({length:slots},(_,i)=>`<button class="slot ${i<done?'done':''}" data-slot="${g.id}:${i}">${i<done?'✓':money(g.per)}</button>`).join('')}</div></div>`;});
  return h;
}
function fixedTotals(){const on=S.fixed.filter(f=>f.on!==false);
  return{out:on.filter(f=>f.type==='out').reduce((a,b)=>a+b.amount,0),in:on.filter(f=>f.type==='in').reduce((a,b)=>a+b.amount,0)};}
function viewFixed(){

    <div class="tiny muted">เหลือใช้หลังหักรายจ่ายประจำ (เฉลี่ยวันละ ฿${money(Math.max(0,net)/30)})</div>

      <div style="flex:1;background:var(--card);border-radius:15px;padding:9px 12px"><div class="tiny muted">รายรับประจำ</div><div class="num pos" style="font-weight:600">+${money(F.in)}</div></div>

  h+=`<div class="periodbar" style="margin-top:14px"><button class="nav" data-step="-1">‹</button>
    <div class="lab">ลงรายการของ ${TH_MF[c.getMonth()]} ${c.getFullYear()+543}</div><button class="nav" data-step="1">›</button></div>`;
  const pend=S.fixed.filter(f=>f.on!==false&&!(f.posted&&f.posted[M])).length;
  h+=`<button class="btn full" data-postall="1" style="margin-bottom:12px">📥 ลงรายการเดือนนี้${pend?` (${pend})`:''}</button><div class="card">`;
  if(!S.fixed.length)h+=`<div class="empty"><div class="em">📅</div><div class="big">ยังไม่มีรายการประจำ</div>
    <div class="tiny">ใส่ค่าเช่า ค่าน้ำค่าไฟ ค่าเน็ต เงินเดือน ฯลฯ</div>
    <div style="margin-top:12px"><button class="btn ghost" data-fixseed="1">ใส่ชุดเริ่มต้นให้เลย</button></div></div>`;
  else ['out','in'].forEach(tp=>{const arr=S.fixed.filter(f=>f.type===tp);if(!arr.length)return;
    h+=`<div class="daysep"><span>${tp==='out'?'💸 รายจ่ายประจำ':'💰 รายรับประจำ'}</span><span class="num">${money(arr.filter(f=>f.on!==false).reduce((a,b)=>a+b.amount,0))}</span></div>`;
    arr.slice().sort((a,b)=>(a.day||1)-(b.day||1)).forEach(f=>{const c2=catOf(f.cat,f.type),done=f.posted&&f.posted[M];
      h+=`<div class="fx" style="${f.on===false?'opacity:.5':''}"><span class="ic">${c2.e}</span>
        <span style="flex:1;min-width:0"><span style="font-weight:500">${esc(f.name)}</span><br><span class="tiny muted">ทุกวันที่ ${f.day||1} · ${esc(c2.n)}</span></span>

        <span class="tag ${done?'ok':'wait'}">${f.on===false?'ปิดอยู่':done?'ลงแล้ว ✓':'รอลง'}</span></span>

  h+=`</div>`;
  if(S.fixed.length){h+=`<h2 class="sec">🔮 คาดการณ์ 6 เดือนข้างหน้า</h2><div class="card">`;let acc=0;

      h+=`<div class="bline row"><span style="flex:1">${TH_MF[d.getMonth()]} ${d.getFullYear()+543}</span>

  return h;
}
function debtStats(){const a=S.debts||[];
  return{left:a.reduce((x,d)=>x+Math.max(0,(d.n-(d.paid||0))*d.per),0),
    perM:a.filter(d=>(d.paid||0)<d.n).reduce((x,d)=>x+d.per,0),
    paid:a.reduce((x,d)=>x+(d.paid||0)*d.per,0)};}
function viewDebt(){
  const D=S.debts||[],st=debtStats();
  let h=subHead('💳 ผ่อนชำระ','<button class="pill" data-newdebt="1">＋ เพิ่ม</button>');
  h+=`<div class="trio" style="margin-bottom:14px">
    <div><div class="k">หนี้คงเหลือ</div><div class="v neg num">${money(st.left)}</div></div>
    <div><div class="k">จ่ายต่อเดือน</div><div class="v num">${money(st.perM)}</div></div>

function cardCycle(w){
  const now=new Date(),stmt=Number(w.stmt||0),due=Number(w.due||0);
  if(!stmt)return null;
  let e=new Date(now.getFullYear(),now.getMonth(),stmt);
  if(now.getDate()>stmt)e=new Date(now.getFullYear(),now.getMonth()+1,stmt);
  const st=new Date(e);st.setMonth(e.getMonth()-1);st.setDate(stmt+1);
  const list=S.tx.filter(t=>{const d=parse(t.date);return d>=st&&d<=e&&(t.w===w.id||t.w2===w.id);});
  let amt=0;list.forEach(t=>{if(t.type==='out'&&t.w===w.id)amt+=t.amount;
    else if(t.type==='tf'&&t.w2===w.id)amt-=t.amount; else if(t.type==='tf'&&t.w===w.id)amt+=t.amount;
    else if(t.type==='adj'&&t.w===w.id)amt-=t.amount;});
  let dd=null;
  if(due){dd=new Date(e.getFullYear(),e.getMonth(),due);if(due<=stmt)dd.setMonth(dd.getMonth()+1);}
  return{start:st,end:e,amt,due:dd,left:Math.ceil((e-now)/864e5)};
}

function renderAdd(){
  $('#addhost').innerHTML=addOpen?addHTML():'';

function openAdd(tab){
  if(!S.wallets.length)S.wallets=[{id:uid(),name:'เงินสด',emoji:'👛',kind:'cash',open:0}];
  addOpen=true;AD.tab=tab||AD.tab;AD.expr='';AD.note='';AD.date=key(new Date());addCatQ='';
  if(!AD.w||!walOf(AD.w))AD.w=(payWallets()[0]||S.wallets[0]).id;
  if(AD.tab==='cc'){const c=creditWallets();AD.w2=c.length?c[0].id:null;
    const p=payWallets();AD.w=p.length?p[0].id:S.wallets[0].id;}
  if(AD.tab==='tf'&&S.wallets.length>1){const o=S.wallets.find(x=>x.id!==AD.w);AD.w2=o?o.id:null;}
  if(AD.tab==='inst'){const d=(S.debts||[]).find(x=>(x.paid||0)<x.n);AD.debt=d?d.id:null;if(d)AD.expr=String(d.per);}
  renderAdd();
}
function closeAdd(){addOpen=false;renderAdd();render();}
function liveEq(){
  if(!/[+\-*/]/.test(AD.expr))return'';
  const v=calcExpr(AD.expr);return v?'= '+money(v,2)+' ':'';
}
function applyPct(){
  const m=AD.expr.match(/^(.*?)([+\-*/])(\d+\.?\d*)$/);
  if(m){const A=calcExpr(m[1]),op=m[2],B=parseFloat(m[3]);
    const v=(op==='+'||op==='-')?A*B/100:B/100;
    AD.expr=m[1]+op+String(Math.round(v*100)/100);
  }else{const n=parseFloat(AD.expr)||0;AD.expr=String(Math.round(n)/100);}
}
function pressKey(k){
  const disp=$('#amtDisp');
  if(k==='save')return saveAdd();
  if(k==='C')AD.expr='';
  else if(k==='back')AD.expr=AD.expr.slice(0,-1);
  else if(k==='%'){if(!AD.expr)return;applyPct();}
  else if(k==='=')AD.expr=String(calcExpr(AD.expr));
  else if('+-*/'.includes(k)){if(!AD.expr)return;if('+-*/'.includes(AD.expr.slice(-1)))AD.expr=AD.expr.slice(0,-1);AD.expr+=k;}
  else AD.expr+=k;
  if(disp)disp.textContent=AD.expr||'0';
  const eq=$('#amtEq');if(eq)eq.textContent=liveEq();
}
function saveAdd(){
  const v=calcExpr(AD.expr);
  if(!v||v<=0){toast('ใส่จำนวนเงินก่อนนะคะ');return;}
  const t=AD.tab;
  if(t==='out'||t==='in'){
    S.tx.push({id:uid(),type:t,amount:v,cat:AD.cat,note:AD.note.trim(),date:AD.date,ts:Date.now(),w:AD.w});
    toast(`บันทึกแล้ว ${t==='in'?'+':'-'}฿${money(v)} 🎉`);
  }else if(t==='cc'){
    if(!AD.w2){toast('เลือกบัตรเครดิตก่อนค่ะ');return;}
    if(AD.ccMode==='back'){
      S.tx.push({id:uid(),type:'adj',amount:v,note:AD.note.trim()||'รับ Cashback',date:AD.date,ts:Date.now(),w:AD.w2,cc:true});
      toast(`รับ Cashback ฿${money(v)} 🎁`);
    }else if(AD.ccMode==='cash'){
      S.tx.push({id:uid(),type:'tf',amount:v,note:AD.note.trim()||'กดเงินสดจากบัตร',date:AD.date,ts:Date.now(),w:AD.w2,w2:AD.w,cc:true});
      toast(`กดเงินสด ฿${money(v)} ✓`);
    }else{
      S.tx.push({id:uid(),type:'tf',amount:v,note:AD.note.trim()||'จ่ายบัตรเครดิต',date:AD.date,ts:Date.now(),w:AD.w,w2:AD.w2,cc:true});
      toast(`จ่ายบัตรเครดิต ฿${money(v)} ✓`);
    }
  }else if(t==='tf'){
    if(!AD.w2||AD.w2===AD.w){toast('เลือกกระเป๋าปลายทางที่ต่างจากต้นทางค่ะ');return;}
    S.tx.push({id:uid(),type:'tf',amount:v,note:AD.note.trim()||'โอนเงิน',date:AD.date,ts:Date.now(),w:AD.w,w2:AD.w2});
    toast(`โอนเงิน ฿${money(v)} ✓`);
  }else{
    const d=(S.debts||[]).find(x=>x.id===AD.debt);
    if(!d){toast('เลือกรายการผ่อนก่อนค่ะ');return;}
    if((d.paid||0)>=d.n){toast('รายการนี้ผ่อนหมดแล้ว 🎉');return;}
    d.paid=(d.paid||0)+1;
    const cid=S.cats.out.find(c=>c.id==='debt')?'debt':S.cats.out[0].id;
    S.tx.push({id:uid(),type:'out',amount:v,cat:cid,note:AD.note.trim()||`${d.name} งวดที่ ${d.paid}`,date:AD.date,ts:Date.now(),w:AD.w,debt:d.id});
    toast(`จ่ายงวดที่ ${d.paid}/${d.n} แล้ว 💸`);
  }
  save();AD.expr='';AD.note='';renderAdd();
}

function noteSuggest(){
  const seen={},out=[];
  S.tx.slice().sort((a,b)=>b.ts-a.ts).forEach(t=>{const n=(t.note||'').trim();
    if(n&&!seen[n]&&out.length<8){seen[n]=1;out.push(n);}});
  const def=AD.tab==='in'?['เงินเดือน','โบนัส','งานเสริม']:['ค่าอาหาร','ค่าเดินทาง','ค่ากาแฟ','ของใช้'];
  def.forEach(d=>{if(out.length<8&&!seen[d])out.push(d);});
  return out;
}

let dpCur=null;
function drawDP(){
  const y=dpCur.getFullYear(),m=dpCur.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7,tk=key(new Date());
  let cells='';
  for(let i=0;i<start;i++)cells+=`<div class="cell off"></div>`;
  for(let d=1;d<=last.getDate();d++){const k=`${y}-${pad(m+1)}-${pad(d)}`;
    cells+=`<button class="cell ${k===AD.date?'sel':''} ${k===tk?'today':''}" data-dp="${k}"><span>${d}</span></button>`;}
  $('#dpBox').innerHTML=`<div class="row" style="justify-content:center;gap:14px;margin-bottom:8px">
      <button class="tag" data-dpm="-1" style="padding:6px 13px">‹</button>
      <b class="cute" style="font-size:16px">${TH_MF[m]} ${y+543}</b>
      <button class="tag" data-dpm="1" style="padding:6px 13px">›</button></div>
    <div class="cal" style="padding:0">${['จ','อ','พ','พฤ','ศ','ส','อา'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>`;
  $('#dpBox').querySelectorAll('[data-dpm]').forEach(b=>b.onclick=()=>{dpCur=new Date(y,m+Number(b.dataset.dpm),1);drawDP();});
  $('#dpBox').querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{AD.date=b.dataset.dp;drawDP();});
}

  HOME_SEC.forEach(s=>{if(!order.includes(s.id))order.push(s.id);});

    $('#roBox').innerHTML=order.map((id,i)=>{const s=HOME_SEC.find(x=>x.id===id);const hid=S.homeHide&&S.homeHide[id];
      return`<div class="tx" style="cursor:default"><span class="ic">${i+1}</span>

    $('#roBox').querySelectorAll('[data-ro]').forEach(b=>b.onclick=()=>{
      const[a,v]=b.dataset.ro.split(':');

      else{const i=Number(v),j=a==='up'?i-1:i+1;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];}

function parseCSVText(txt){
  txt=txt.replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','||c===';'){row.push(f);f='';}
    else if(c==='\n'){row.push(f);f='';rows.push(row);row=[];}
    else if(c!=='\r')f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function normDate(v){v=String(v).trim();
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m){let y=+m[1];if(y>2400)y-=543;return`${y}-${pad(+m[2])}-${pad(+m[3])}`;}
  m=v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);if(m){let y=+m[3];if(y>2400)y-=543;return`${y}-${pad(+m[2])}-${pad(+m[1])}`;}
  return null;}

    r.onload=()=>{let rows;try{rows=parseCSVText(r.result);}catch(e){toast('อ่านไฟล์ไม่ได้ค่ะ');return;}
      if(rows.length<2){toast('ไฟล์ว่างหรือรูปแบบไม่ถูกต้อง');return;}

        out.push({id:uid(),type,amount:Math.abs(a),cat:c.id,note:String(r2[iN]||'').trim(),date:d,ts:Date.now(),w:wid});});

            lend:viewLend,cats:viewCats,memo:viewMemo,about:viewAbout,wallets:viewWallet};
  $('#view').innerHTML=SUB?(SV[SUB]||viewMenu)():(V[TAB]||viewHome)();
  if(!SUB&&TAB==='tx')bindTx();
  if(SUB==='cats')bindCats();
  if(SUB==='about'){const ib=$('#installBtn');if(ib)ib.onclick=async()=>{
    if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;}
    else toast('เปิดไฟล์นี้ในเบราว์เซอร์ แล้วใช้เมนู ⋮ / ปุ่มแชร์ ↑ เพื่อเพิ่มลงหน้าจอค่ะ');};}
  if(!SUB&&TAB==='home')document.querySelectorAll('[data-bub]').forEach(el=>{
    el.onclick=()=>{const{s,e}=range();const it=byCat(txIn(s,e,homeWallet),homeSide).find(x=>x.k===el.dataset.bub);
      if(it)$('#bubhint').innerHTML=`${it.c.e} <b>${esc(it.c.n)}</b> · <span class="num">฿${money(it.v)}</span>`;};});
  window.scrollTo({top:0});
}
const go=t=>{TAB=t;SUB=null;render();};
const goSub=s=>{SUB=s;render();};
async function refreshApp(){
  const lg=$('#markLogo');if(lg){lg.classList.remove('spin');void lg.offsetWidth;lg.classList.add('spin');}
  try{const raw=await Store.get(KEY);if(raw){const d=JSON.parse(raw);S={...S,...d};migrate();lastRaw=raw;}}catch(e){}
  P={mode:'day',cursor:new Date()};TAB='home';SUB=null;homeSide='out';homeWallet='all';txSide='all';txQ='';
  render();toast('อัปเดตข้อมูลล่าสุดแล้ว ☁️');
}
/* =========== EVENTS =========== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-sub],[data-backplan],[data-menu],[data-p],[data-plan],[data-step],[data-side],[data-tside],[data-rside],[data-ctab],[data-tx],[data-k],[data-atab],[data-acat],[data-acsearch],[data-anote],[data-adate],[data-wsel],[data-wsel2],[data-ccm],[data-adebt],[data-add],[data-closeadd],[data-refresh],[data-sync],[data-day],[data-wfil],[data-wpick],[data-mpick],[data-reorder],[data-dayb],[data-newwal],[data-newcard],[data-editwal],[data-paycard],[data-newcat],[data-editcat],[data-budget],[data-newgoal],[data-editgoal],[data-slot],[data-newfix],[data-editfix],[data-postall],[data-fixseed],[data-newdebt],[data-editdebt],[data-debtd],[data-dslot],[data-payd],[data-dhist],[data-newlend],[data-editlend],[data-newmemo],[data-memo],[data-editname],[data-export],[data-seed]');
  if(!b)return;const d=b.dataset;
  if(d.add!==undefined&&b.classList.contains('fab'))return openAdd(AD.tab||'out');
  if(d.closeadd)return closeAdd();
  if(d.refresh)return refreshApp();
  if(d.go)return go(d.go);
  if(d.sub)return goSub(d.sub);
  if(d.backplan){planTab=d.backplan;TAB='plan';SUB=null;return render();}
  if(d.menu){const m=d.menu;
    if(m==='backup'){download(`sky-wallet-${key(new Date())}.json`,JSON.stringify(S,null,2),'application/json');toast('สำรองข้อมูลแล้ว ✓');return;}
    if(m==='export')return exSheet();
    if(m==='import')return importSheet();
    if(m==='theme'){S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;
      $('#themeBtn').textContent=S.theme==='dark'?'☀️':'🌙';save();toast(S.theme==='dark'?'โหมดกลางคืน 🌙':'โหมดกลางวัน ☀️');return;}
    if(m==='install')return goSub('about');
    if(m==='wallets')return go('wallet');
    if(m==='report')return go('report');
    if(['fixed','budget','save','debt','cycle'].includes(m)){planTab=m;return go('plan');}
    if(m==='reset'){openMd(`<h3>🗑️ ล้างข้อมูลทั้งหมด?</h3><p class="tiny muted">รายการ ${S.tx.length} รายการ งบ กระเป๋า และเป้าหมายจะถูกลบถาวรค่ะ</p>
      <div class="row" style="margin-top:16px;gap:9px"><button class="btn ghost" id="rNo" style="flex:1">ยกเลิก</button><button class="btn warn" id="rYes" style="flex:1">ล้างเลย</button></div>`);
      $('#rNo').onclick=closeMd;
      $('#rYes').onclick=()=>{S={profile:{name:'กระเป๋าตังของฉัน'},tx:[],wallets:[{id:uid(),name:'เงินสด',emoji:'👛',kind:'cash',open:0}],
        cats:JSON.parse(JSON.stringify(DEF_CATS)),budgets:{},dailyBudget:0,fixed:[],goals:[],debts:[],lends:[],memos:[],
        homeOrder:HOME_SEC.map(x=>x.id),homeHide:{},theme:S.theme};save();closeMd();go('home');toast('ล้างข้อมูลแล้ว');};return;}
    return goSub(m);}
  if(d.p){P.mode=d.p;return render();}
  if(d.step)return step(+d.step);
  if(d.side){homeSide=d.side;return render();}
  if(d.tside){txSide=d.tside;return render();}
  if(d.plan){planTab=d.plan;TAB='plan';SUB=null;return render();}
  if(d.rside){repSide=d.rside;return render();}
  if(d.ctab){catTab=d.ctab;return render();}
  if(d.day){P.mode='day';P.cursor=parse(d.day);return render();}
  if(d.wfil){homeWallet=homeWallet===d.wfil?'all':d.wfil;return render();}
  if(d.wpick)return walletPicker();
  if(d.mpick)return monthPicker();
  if(d.reorder)return reorderSheet();
  if(d.dayb)return dayBudgetSheet();
  if(d.tx)return editTx(d.tx);
  if(d.k)return pressKey(d.k);
  if(d.atab){AD.tab=d.atab;openAdd(d.atab);return;}
  if(d.acat){AD.cat=d.acat;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));b.classList.add('on');return;}
  if(d.acsearch){addCatQ=addCatQ===''?' ':'';renderAdd();return;}
  if(d.anote)return noteSheet();
  if(d.adate)return dateSheet();
  if(d.wsel!==undefined&&!d.wsel2)return addWalPicker(false);
  if(d.wsel2)return addWalPicker(true);
  if(d.ccm){AD.ccMode=d.ccm;const c=creditWallets();if(c.length&&!AD.w2)AD.w2=c[0].id;renderAdd();return;}
  if(d.adebt){AD.debt=d.adebt;const dd=(S.debts||[]).find(x=>x.id===d.adebt);if(dd)AD.expr=String(dd.per);renderAdd();return;}
  if(d.newwal)return walSheet(null);
  if(d.newcard)return walSheet(null,'credit');
  if(d.sync)return syncSheet();
  if(d.editwal)return walSheet(d.editwal);
  if(d.paycard){AD.ccMode='pay';AD.w2=d.paycard;openAdd('cc');AD.w2=d.paycard;renderAdd();return;}
  if(d.newcat)return catSheet(addOpen?(AD.tab==='in'?'in':'out'):catTab,null);
  if(d.editcat){const[tp,id]=d.editcat.split(':');return catSheet(tp,id);}
  if(d.budget)return budgetSheet(d.budget);
  if(d.newgoal)return goalSheet(null);
  if(d.editgoal)return goalSheet(d.editgoal);
  if(d.slot){const[gid,i]=d.slot.split(':');const g=S.goals.find(x=>x.id===gid);if(!g)return;
    const idx=Number(i)+1;g.done=(g.done===idx)?idx-1:idx;save();render();
    toast(g.done*g.per>=g.target?'ถึงเป้าหมายแล้ว เก่งมาก! 🎉':`หยอดแล้ว ${g.done} ช่อง`);return;}
  if(d.newfix)return fixSheet(null);
  if(d.editfix)return fixSheet(d.editfix);
  if(d.fixseed)return fixSeed();
  if(d.postall){const M=ym(P.cursor);let n=0;S.fixed.forEach(f=>{if(postFixed(f,M))n++;});
    save();render();toast(n?`ลงรายการประจำ ${n} รายการแล้ว ✓`:'เดือนนี้ลงครบแล้วค่ะ');return;}
  if(d.newdebt)return debtSheet(null);
  if(d.editdebt)return debtSheet(d.editdebt);
  if(d.debtd){DID=d.debtd;return goSub('debtd');}
  if(d.dslot){const[did,i]=d.dslot.split(':');const dd=(S.debts||[]).find(x=>x.id===did);if(!dd)return;
    const idx=Number(i)+1;dd.paid=(dd.paid===idx)?idx-1:idx;save();render();
    toast(dd.paid>=dd.n?'ปลดหนี้ครบแล้ว เก่งมาก! 🎉':`จ่ายแล้ว ${dd.paid}/${dd.n} งวด`);return;}
  if(d.payd){AD.debt=d.payd;openAdd('inst');return;}
  if(d.dhist)return debtHistory(d.dhist);
  if(d.newlend)return lendSheet(null);
  if(d.editlend)return lendSheet(d.editlend);
  if(d.newmemo)return memoSheet(null);
  if(d.memo)return memoSheet(d.memo);
  if(d.editname){openMd(`<h3>✏️ ชื่อกระเป๋าตัง</h3><input id="pN" type="text" value="${esc(S.profile.name||'')}" placeholder="กระเป๋าตังของฉัน">
    <button class="btn full" id="pOk" style="margin-top:14px">บันทึก</button>`);
    $('#pOk').onclick=()=>{S.profile.name=$('#pN').value.trim()||'กระเป๋าตังของฉัน';save();closeMd();render();toast('บันทึกแล้ว ✓');};return;}
  if(d.export)return exSheet();
  if(d.seed)return seed();
});
$('#themeBtn').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;
  $('#themeBtn').textContent=S.theme==='dark'?'☀️':'🌙';save();};
try{
  document.addEventListener('visibilitychange',()=>{ if(document.hidden)hardSave(); else autoPull(); });
  window.addEventListener('focus',()=>autoPull());
  window.addEventListener('pageshow',()=>autoPull(true));
  window.addEventListener('pagehide',hardSave);
  window.addEventListener('beforeunload',hardSave);
  window.addEventListener('storage',e=>{ if(e.key===KEY&&e.newValue&&e.newValue!==lastRaw)autoPull(); });
}catch(e){}
/* =========== BOOT =========== */
function migrate(){
  if(!S.cats||!S.cats.out)S.cats=JSON.parse(JSON.stringify(DEF_CATS));
  S.profile=S.profile||{name:'กระเป๋าตังของฉัน'};
  S.fixed=S.fixed||[];S.goals=S.goals||[];S.debts=S.debts||[];S.lends=S.lends||[];S.memos=S.memos||[];
  S.budgets=S.budgets||{};S.tx=S.tx||[];
  if(!Array.isArray(S.wallets)||!S.wallets.length)S.wallets=[{id:'w_cash',name:'เงินสด',emoji:'👛',kind:'cash',open:0}];
  const w0=S.wallets[0].id;
  S.tx.forEach(t=>{if(!t.w)t.w=w0;});
  const ids=HOME_SEC.map(x=>x.id);
  S.homeOrder=(Array.isArray(S.homeOrder)?S.homeOrder.filter(x=>ids.includes(x)):[]);
  ids.forEach(i=>{if(!S.homeOrder.includes(i))S.homeOrder.push(i);});
  S.homeHide=S.homeHide||{};
}
(async function(){
  Store.init();
  const raw=await Store.get(KEY);
  if(raw){try{S={...S,...JSON.parse(raw)};lastRaw=raw;}catch(e){}}
  migrate();
  document.documentElement.dataset.theme=S.theme==='dark'?'dark':'light';
  $('#themeBtn').textContent=S.theme==='dark'?'☀️':'🌙';
  P={mode:'day',cursor:new Date()};TAB='home';SUB=null;
  $('#loading').remove();$('#app').hidden=false;paintSync();render();
})();
</script>
